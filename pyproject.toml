[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-studio"
version = "0.0.0"
description = "Open-source, local-first Data + AI platform with vendor-neutral execution contracts."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
  "tzdata>=2024.1",
]

[project.scripts]
ronin = "studio_cli.entrypoint:main"
ronin-runner-broker = "studio_runner_broker.entrypoint:main"
ronin-broker-worker = "studio_runner_broker.worker_entrypoint:main"

[project.entry-points."ronin.plugins.v1"]
workspaces = "studio_plugin_workspaces.plugin:factory"
logging = "studio_plugin_observability.plugins:logging_factory"
monitoring = "studio_plugin_observability.plugins:monitoring_factory"
  govern_studio = "studio_synthetic_data.plugin:factory"
  ai_studio = "studio_ai_studio.plugin:factory"
  genai_studio = "studio_genai.plugin:factory"
data_science_studio = "studio_ml.plugin:factory"
cloud_studio = "studio_cloud.plugin:factory"

[project.entry-points."ronin.formats.v1"]
delta = "studio_synthetic_data.formats:delta_provider"
iceberg = "studio_synthetic_data.formats:iceberg_provider"
hudi = "studio_synthetic_data.formats:hudi_provider"

[project.optional-dependencies]
data-plane = [
  "boto3>=1.35,<2",
  "duckdb>=1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=15,<24",
]
open-tables = [
  "deltalake>=0.20,<2",
  "pyiceberg[sql-sqlite]>=0.8,<1",
]
ml = [
  "numpy>=1.23,<2.4",
  "scikit-learn>=1.5,<2",
]
security = [
  "PyJWT[crypto]>=2.10,<3",
]
streaming = [
  "confluent-kafka>=2,<4",
]
dev = [
  "hypothesis>=6.138,<7",
  "mutmut==3.7.0",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6.2,<7",
  "pytest-randomly>=3.16,<4",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
studio_storage = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/ronin/web" = [
  "web/index.html",
  "web/routes.json",
  "web/README.md",
  "web/data-enginerring-studio.html",
  "web/data-enginerring-studio.css",
  "web/data-enginerring-studio.js",
]
"share/ronin/web/assets" = [
  "web/assets/ronin-logo-full.png",
  "web/assets/ronin-logo-mark.png",
]
"share/ronin/web/js" = [
  "web/js/a11y.js",
  "web/js/access-studio.js",
  "web/js/ai-studio.js",
  "web/js/alerts-studio.js",
  "web/js/api.js",
  "web/js/app.js",
  "web/js/catalog-studio.js",
  "web/js/cloud-studio.js",
  "web/js/command-palette.js",
  "web/js/context-bar.js",
  "web/js/data-engineering-studio.js",
  "web/js/debugger-studio.js",
  "web/js/deployment-studio.js",
  "web/js/dom.js",
  "web/js/environment-studio.js",
  "web/js/features.js",
  "web/js/finops-studio.js",
  "web/js/graph-studio.js",
  "web/js/i18n.js",
  "web/js/ingestion-studio.js",
  "web/js/ml-studio-journey.js",
  "web/js/ml-features-studio.js",
  "web/js/notebook-studio.js",
  "web/js/performance-studio.js",
  "web/js/project-journey.js",
  "web/js/quality-studio.js",
  "web/js/semantic-studio.js",
  "web/js/streaming-studio.js",
  "web/js/scheduler-studio.js",
  "web/js/studio-context.js",
  "web/js/synthetic-data-studio.js",
  "web/js/synthetic-journey.js",
  "web/js/workspace-journey.js",
]
"share/ronin/web/styles" = [
  "web/styles/base.css",
  "web/styles/components.css",
  "web/styles/layout.css",
  "web/styles/tokens.css",
]
"share/ronin/web/cloud-studio" = [
  "web/cloud-studio.html",
  "web/cloud-studio.css",
  "web/cloud-studio.js",
]
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "**/build/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "C4", "PT", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"packages/**/tests/**/*.py" = ["S101", "PT011"]
"python/studio_storage/catalog.py" = ["E501"]
"python/studio_storage/postgres_ml.py" = ["E501"]
"python/studio_ai_studio/http_api.py" = ["E501"]
"python/studio_synthetic_data/async_generation.py" = ["E501", "SIM105"]
"python/studio_synthetic_data/engine.py" = ["E501"]
"python/studio_synthetic_data/local_catalogs.py" = ["E501"]
"python/studio_synthetic_data/plugin.py" = ["E501"]
"python/studio_synthetic_data/publication.py" = ["E501"]
"tools/cloud_studio_e2e.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = false
mypy_path = "python:packages/pyronin/src"
packages = [
  "studio_connectors",
  "studio_core",
  "studio_finops",
  "studio_genai",
  "studio_ai_studio",
  "studio_lakehouse",
  "studio_ml",
  "studio_notebook",
  "studio_observability",
  "studio_runners",
  "studio_runner_broker",
  "studio_kernel",
  "studio_orchestrator",
  "studio_quality",
  "studio_security",
  "studio_semantic",
  "studio_sql",
  "studio_storage",
  "studio_streaming",
  "studio_cloud",
  "studio_synthetic_data",
  "studio_plugin_observability",
  "studio_plugin_sdk",
  "studio_plugin_testkit",
  "studio_plugin_workspaces",
  "studio_runtime",
  "studio_vcs",
  "studio_execution",
  "studio_migration",
  "studio_server",
  "studio_worker",
  "studio_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pyronin/tests"]
pythonpath = ["python", "packages/pyronin/src", "packages/ronin-plugin-performance/src", "."]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "e2e: full v0.1 acceptance journey; requires Docker and a built image",
  "asyncio: run the test in an asyncio event loop",
]
# Existing integration tests intentionally drive their own event loops with
# asyncio.run; auto preserves that contract while still enabling @pytest.mark.asyncio.
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
  "studio_connectors",
  "studio_core",
  "studio_finops",
  "studio_genai",
  "studio_lakehouse",
  "studio_ml",
  "studio_notebook",
  "studio_observability",
  "studio_kernel",
  "studio_runners",
  "studio_runner_broker",
  "studio_orchestrator",
  "studio_quality",
  "studio_security",
  "studio_semantic",
  "studio_sql",
  "studio_storage",
  "studio_streaming",
  "studio_vcs",
  "studio_execution",
  "studio_server",
  "studio_worker",
  "studio_cli",
  "studio_migration",
  "studio_plugin_observability",
  "studio_plugin_sdk",
  "studio_plugin_testkit",
  "studio_plugin_workspaces",
  "studio_runtime",
  "pyronin",
  "tools",
]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/studio_core/*"]
pytest_add_cli_args = [
  "-o",
  "addopts=",
  "-o",
  "pythonpath=../packages/pyronin/src",
]
pytest_add_cli_args_test_selection = [
  "tests/test_contract_snapshots.py",
  "tests/test_core_ir.py",
  "tests/test_core_ir_invariant_edges.py",
  "tests/test_diagnostics.py",
  "tests/test_instance_keys.py",
  "tests/test_operators.py",
  "tests/test_projects.py",
  "tests/test_project_manifest.py",
  "tests/test_runtime_profiles.py",
  "tests/test_canonical_json.py",
  "tests/test_grants.py",
  "tests/test_catalog_search.py",
  "tests/test_ontology_actions.py",
  "tests/test_ontology_runtime.py",
  "tests/test_quality_runtime.py",
  "tests/test_genai_foundation.py",
  "tests/test_ml_foundation.py",
  "tests/test_portability.py",
  "tests/test_audit.py",
  "tests/test_rql.py",
  "tests/test_bundle_project_inventory.py",
]
mutate_only_covered_lines = true
on_dependency_change = "ignore"

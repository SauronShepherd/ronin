[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-studio"
version = "0.0.0"
description = "Open-source, local-first Data + AI platform with vendor-neutral execution contracts."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.138,<7",
  "mutmut==3.7.0",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-randomly>=3.16,<4",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "C4", "PT", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python"
packages = ["studio_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=studio_core --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["studio_core"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mutmut]
source_paths = ["python/studio_core"]
pytest_add_cli_args = ["-o", "addopts="]
pytest_add_cli_args_test_selection = ["tests"]
mutate_only_covered_lines = true

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-studio"
version = "0.0.0"
description = "Open-source, local-first Data + AI platform with vendor-neutral execution contracts."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

# TODO(W5): enable when studio_cli.main exists.
# [project.scripts]
# ronin = "studio_cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.138,<7",
  "mutmut==3.7.0",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "pytest-randomly>=3.16,<4",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "C4", "PT", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"packages/**/tests/**/*.py" = ["S101", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "python:packages/pyronin/src"
packages = [
  "studio_core",
  "studio_notebook",
  "studio_runners",
  "studio_kernel",
  "studio_orchestrator",
  "studio_storage",
  "studio_vcs",
  "studio_server",
  "studio_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pyronin/tests"]
pythonpath = ["python", "packages/pyronin/src", "."]
addopts = "-ra --strict-config --strict-markers"
markers = ["e2e: full v0.1 acceptance journey; requires Docker and a built image"]

[tool.coverage.run]
branch = true
source = [
  "studio_core",
  "studio_notebook",
  "studio_kernel",
  "studio_runners",
  "studio_orchestrator",
  "studio_storage",
  "studio_vcs",
  "studio_server",
  "studio_cli",
  "pyronin",
]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/studio_core"]
pytest_add_cli_args = ["-o", "addopts="]
pytest_add_cli_args_test_selection = [
  "tests/test_contract_snapshots.py",
  "tests/test_core_ir.py",
  "tests/test_core_ir_invariant_edges.py",
  "tests/test_diagnostics.py",
  "tests/test_instance_keys.py",
  "tests/test_operators.py",
  "tests/test_project_manifest.py",
  "tests/test_projects.py",
  "tests/test_runtime_profiles.py",
]
mutate_only_covered_lines = true

/* --- RONIN full-logo + collapsible navigation pass --- */
:root{--sidebar-expanded:286px;--sidebar-collapsed:84px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.app{grid-template-columns:var(--sidebar-expanded) minmax(0,1fr);transition:grid-template-columns .22s ease}
.sidebar{width:var(--sidebar-expanded);padding:14px 12px 16px;transition:width .22s ease,padding .22s ease;overflow:visible}
.brand{appearance:none;border:0;background:transparent;color:inherit;width:100%;height:108px;padding:2px 7px 14px;margin:0 0 2px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;position:relative;transition:background .16s ease}
.brand:hover{background:rgba(255,255,255,.035)}
.brand:focus-visible{outline:3px solid rgba(240,160,16,.38);outline-offset:2px}
.brand-logo-full{display:block;width:min(244px,100%);height:88px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.26));user-select:none;pointer-events:none}
.brand-logo-compact{display:none;width:61px;height:61px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.28));user-select:none;pointer-events:none}
.brand-collapse-glyph{position:absolute;right:7px;bottom:8px;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#D9C8BB;font-size:13px;opacity:0;transform:translateX(3px);transition:.16s ease;pointer-events:none}
.brand:hover .brand-collapse-glyph,.brand:focus-visible .brand-collapse-glyph{opacity:1;transform:none}
.nav-item{position:relative;min-height:42px}.nav-icon{flex:0 0 20px;width:20px;height:20px;font-size:16px}.nav-item>span:last-child{white-space:nowrap}
.app.sidebar-collapsed{grid-template-columns:var(--sidebar-collapsed) minmax(0,1fr)}
.app.sidebar-collapsed .sidebar{width:var(--sidebar-collapsed);padding:14px 8px}
.app.sidebar-collapsed .brand{height:82px;padding:4px 0 10px}
.app.sidebar-collapsed .brand-logo-full{display:none}
.app.sidebar-collapsed .brand-logo-compact{display:block}
.app.sidebar-collapsed .brand-collapse-glyph{right:-2px;bottom:5px;transform:rotate(180deg);opacity:.72}
.app.sidebar-collapsed .brand:hover .brand-collapse-glyph{transform:rotate(180deg)}
.app.sidebar-collapsed .nav-label,.app.sidebar-collapsed .nav-children,.app.sidebar-collapsed .nav-item>span:not(.nav-icon),.app.sidebar-collapsed .workspace-chip>div:not(.avatar-sq),.app.sidebar-collapsed .workspace-chip>.spacer,.app.sidebar-collapsed .motto{display:none!important}
.app.sidebar-collapsed .nav{gap:5px}.app.sidebar-collapsed .nav-item{justify-content:center;padding:10px 0;gap:0}.app.sidebar-collapsed .nav-icon{font-size:18px;width:28px;height:22px}
.app.sidebar-collapsed .workspace-chip{justify-content:center;padding:11px 0;margin:8px 0;border-radius:10px;cursor:pointer}.app.sidebar-collapsed .avatar-sq{width:38px;height:38px;border-radius:10px}
.app.sidebar-collapsed .nav-item[data-label]:hover:after,.app.sidebar-collapsed .nav-item[data-label]:focus-visible:after{content:attr(data-label);position:absolute;left:65px;top:50%;transform:translateY(-50%);background:#241A16;color:#fff;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 26px rgba(0,0,0,.2);padding:7px 10px;border-radius:7px;font-size:12px;line-height:1;white-space:nowrap;z-index:80;pointer-events:none}
.app.sidebar-collapsed .nav-item.active:before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:3px;border-radius:3px;background:#F0A010}
.app.sidebar-collapsed .main{min-width:0}
@media (max-width:900px){
  :root{--sidebar-collapsed:76px}
  .app,.app.sidebar-collapsed{grid-template-columns:var(--sidebar-collapsed) minmax(0,1fr)}
  .sidebar,.app.sidebar-collapsed .sidebar{width:var(--sidebar-collapsed);padding:12px 7px}
  .brand,.app.sidebar-collapsed .brand{height:76px;padding:3px 0 9px}
  .brand-logo-full{display:none!important}.brand-logo-compact{display:block!important;width:56px;height:56px}
  .brand-collapse-glyph{display:none}
  .nav-label,.nav-children,.nav-item>span:not(.nav-icon),.workspace-chip>div:not(.avatar-sq),.workspace-chip>.spacer,.motto{display:none!important}
  .nav-item{justify-content:center!important;padding:10px 0!important;gap:0!important}.nav-icon{font-size:18px;width:28px;height:22px}
  .workspace-chip{justify-content:center!important;padding:10px 0!important}
}

function schemaDriftModal(){showModal(`<div class="modal-head"><div><div class="modal-title">⚠ Schema Drift Detected</div><div class="small muted">Incoming data changed from the last successful run.</div></div><div class="spacer"></div><span class="pill warn">Detected 12 min ago</span><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><div class="grid cols-3"><div class="card"><div class="card-title">Affected Resource</div><strong>Sales Data Ingestion</strong><div class="small muted">sales-data-pipeline</div><div class="doc-callout" style="margin-top:12px"><strong>Potential impact</strong><div class="small muted">Downstream datasets, models and dashboards may be affected.</div></div></div><div class="card"><div class="card-title">Schema Changes (6 columns)</div><div class="table-wrap"><table class="table"><thead><tr><th>Column</th><th>Previous</th><th>New</th><th>Status</th></tr></thead><tbody>${[['order_id','STRING','STRING','Unchanged'],['order_date','DATE','TIMESTAMP','Changed Type'],['discount_amount','—','DECIMAL','Added'],['coupon_code','STRING','—','Removed'],['region','—','STRING','Added']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${statusPill(r[3])}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-title">Recommended Actions</div>${['Review the changes','Update mappings if needed','Validate and test','Deploy updates'].map((x,i)=>`<div style="display:flex;gap:10px;padding:8px 0"><div class="step-circle" style="width:28px;height:28px">${i+1}</div><div><strong class="small">${x}</strong><div class="tiny muted">${['Check compatibility','Map new columns','Run validation','Apply changes'][i]}</div></div></div>`).join('')}</div></div></div><div class="modal-foot"><button class="btn" data-close-modal>Ignore for now</button><button class="btn">Open pipeline</button><button class="btn">Accept safe changes</button><button class="btn primary">Review mappings →</button></div>`,'large')}
function tutorialStart(){closeModal();state.tutorialStep=0;renderTour()}
function renderTour(){const root=document.getElementById('tour-root');const steps=[
 {sel:'#global-search',title:'Global Search',text:'Find anything — datasets, graphs, models, connections, runs and commands.'},
 {sel:'[data-route="create"]',title:'Create New',text:'Start building. Create data sources, graphs, queries, pipelines and AI assets.'},
 {sel:'#workspace-switch',title:'Switch Workspaces',text:'Work in different projects and environments without losing context.'},
 {sel:'[data-route="observability"]',title:'Observe progress',text:'Inspect runs, evidence, logs, metrics and cost from one place.'}
];if(state.tutorialStep>=steps.length){root.innerHTML='';toast('Tutorial completed','success');return}const st=steps[state.tutorialStep],el=document.querySelector(st.sel);if(!el){root.innerHTML='';return}const r=el.getBoundingClientRect();const x=Math.max(12,Math.min(window.innerWidth-360,r.right+24));const y=Math.max(80,Math.min(window.innerHeight-220,r.top));root.innerHTML=`<div class="tour-dim"></div><div class="tour-highlight" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div><div class="tour-bubble" style="left:${x}px;top:${y}px"><div class="tour-num">${state.tutorialStep+1}</div><strong>${st.title}</strong><p class="small muted">${st.text}</p><div style="display:flex;gap:8px"><button class="btn small" data-action="skip-tour">Skip</button><div class="spacer"></div><button class="btn small primary" data-action="next-tour">${state.tutorialStep===steps.length-1?'Finish':'Next →'}</button></div></div>`;document.querySelector('[data-action="next-tour"]').onclick=()=>{state.tutorialStep++;renderTour()};document.querySelector('[data-action="skip-tour"]').onclick=()=>{root.innerHTML=''}}
function agentStudioModal(){showModal(`<div class="modal-head"><div><div class="modal-title">Agent Studio</div><div class="small muted">Design a RAG assistant with tools, memory and evaluation.</div></div><div class="spacer"></div><button class="btn">▶ Test</button><button class="btn">▥ Evaluate</button><button class="btn primary">◇ Deploy</button><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><div class="three-pane" style="grid-template-columns:210px minmax(0,1fr) 320px"><div class="panel"><div class="panel-head">Components</div><div class="panel-body">${['User Query','File Upload','Webhook','Retrieve Knowledge','Hybrid Search','LLM','Embedding Model','API Call','Web Search','Code Execution','Response','Output Guardrails'].map(x=>`<div class="list-item"><div class="list-icon">✦</div><span class="small">${x}</span></div>`).join('')}</div></div><div><div class="panel ai-canvas">${[['User Query',4,42],['Retrieve Knowledge',22,42],['Prompt Template',42,42],['Tool Call',60,42],['LLM Response',76,42],['Output Guardrails',88,42]].map((x,i)=>`<div class="flow-node ${i===1?'selected':''}" style="left:${x[1]}%;top:${x[2]}%"><strong>${x[0]}</strong></div>`).join('')}</div><div class="panel" style="margin-top:12px"><div class="tabs" style="padding:0 12px"><button class="tab active">Preview</button><button class="tab">Trace</button><button class="tab">Evaluation</button><button class="tab">Cost</button></div><div class="panel-body"><div class="chat"><div class="msg user">What are the key features of our enterprise product?</div><div class="msg bot">Our enterprise product combines unified data foundations, graph intelligence, AI services and governed deployment. Would you like implementation details?</div></div><input class="field" style="width:100%;margin-top:10px" placeholder="Ask your agent anything..."></div></div></div><div class="panel"><div class="panel-head">Retrieve Knowledge</div><div class="panel-body"><div class="field-group"><label class="field-label">Knowledge base</label><select class="field"><option>Product Knowledge Base</option></select><label class="field-label">Top-k results</label><input class="field" value="5"><label class="field-label">Reranking</label><select class="field"><option>RONIN Reranker (v1)</option></select><label class="field-label">Freshness policy</label><select class="field"><option>Last 90 days</option></select></div></div></div></div></div><div class="modal-foot"><button class="btn" data-close-modal>Close</button><button class="btn primary">Save Agent</button></div>`,'large')}
function templateGalleryModal(){showModal(`<div class="modal-head"><div><div class="modal-title">Template Gallery</div><div class="small muted">Start from a reusable pattern and customize everything.</div></div><div class="spacer"></div><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><div class="tabs"><button class="tab active">All</button><button class="tab">Data</button><button class="tab">Graphs</button><button class="tab">Pipelines</button><button class="tab">AI & RAG</button></div><div class="grid cols-3">${[['Customer 360','Graph + AI','20 min'],['Fraud Detection','Graph analytics','30 min'],['Snowflake to RAG','Data + AI','25 min'],['Daily ETL','Pipeline','15 min'],['Document Intelligence','RAG','30 min'],['Deploy as a Service','Deployment','15 min']].map(x=>`<div class="card"><div class="entity-icon">✦</div><strong>${x[0]}</strong><div class="small muted" style="margin:6px 0 12px">${x[1]} · ${x[2]}</div><button class="btn small primary" data-action="use-template">Use template</button></div>`).join('')}</div></div>`,'large')}
function lessonModal(){showModal(`<div class="modal-head"><div><div class="modal-title">Interactive guide</div><div class="small muted">${esc(state.helpPath)} · practical walkthrough</div></div><div class="spacer"></div><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><div class="detail-columns"><div><div class="card"><div class="tiny muted" style="letter-spacing:.12em">STEP 1 OF 4</div><h2 style="margin:8px 0">Understand the workflow</h2><p class="small muted">This guide links concepts to the actual prototype. Continue to open the relevant product area, perform a safe dummy action, and inspect the resulting state.</p><div class="progress"><span style="width:25%"></span></div></div><div class="card" style="margin-top:12px"><div class="card-title">What you will learn</div>${['Where this workflow lives in the navigation','Which settings are required versus optional','How validation and explainability appear','Where to observe the resulting run'].map(x=>`<div class="feature-row"><div class="list-icon">✓</div><div class="small">${x}</div></div>`).join('')}</div></div><div class="card"><div class="card-title">Guide controls</div><div class="small muted">All actions use dummy data and stay inside this self-contained prototype.</div><button class="btn primary" style="width:100%;margin-top:12px" data-action="start-tour">Start guided UI tour</button></div></div></div><div class="modal-foot"><button class="btn" data-close-modal>Close</button><button class="btn primary" data-action="lesson-open">Open related area →</button></div>`,'large')}
function bindLocal(){const root=document.getElementById('view');document.querySelectorAll('#nav [data-route]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.route)));document.querySelectorAll('#nav [data-navtab-group]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();state.tabs[el.dataset.navtabGroup]=el.dataset.navtab;render()}));root.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.route)));root.querySelectorAll('[data-tab-group]').forEach(el=>el.addEventListener('click',()=>{state.tabs[el.dataset.tabGroup]=el.dataset.tab;render()}));root.querySelectorAll('[data-asset]').forEach(el=>el.addEventListener('click',()=>{state.selectedAsset=el.dataset.asset;state.assetInspectorTab='Overview';render()}));root.querySelectorAll('[data-connection]').forEach(el=>el.addEventListener('click',()=>{state.selectedConnection=el.dataset.connection;render()}));root.querySelectorAll('[data-run]').forEach(el=>el.addEventListener('click',()=>{state.selectedRun=el.dataset.run;render()}));root.querySelectorAll('[data-node]').forEach(el=>el.addEventListener('click',()=>{state.selectedGraphNode=el.dataset.node;render()}));root.querySelectorAll('[data-create]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.create)));root.querySelectorAll('[data-create-category]').forEach(el=>el.addEventListener('click',()=>{state.createCategory=el.dataset.createCategory;render()}));root.querySelectorAll('[data-create-dest]').forEach(el=>el.addEventListener('click',()=>{const d=el.dataset.createDest;if(d==='new-connection')newConnectionModal();else go(d)}));root.querySelectorAll('[data-inspector-tab]').forEach(el=>el.addEventListener('click',()=>{state.assetInspectorTab=el.dataset.inspectorTab;render()}));root.querySelectorAll('[data-help-path]').forEach(el=>el.addEventListener('click',()=>{state.helpPath=el.dataset.helpPath;render()}));root.querySelectorAll('[data-switch]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('on')));root.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action)))}
function handleAction(a){if(a==='help')go('help');else if(a==='notifications')showModal(`<div class="modal-head"><div class="modal-title">Notifications</div><div class="spacer"></div><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body">${[['Schema drift detected','Sales Data Ingestion needs review','warn'],['Deployment completed','Customer 360 Service is healthy','success'],['Budget threshold','AI evaluation spend reached 75%','info']].map(x=>`<div class="list-item"><div class="list-icon">•</div><div><strong class="small">${x[0]}</strong><div class="tiny muted">${x[1]}</div></div></div>`).join('')}</div>`,'small');else if(a==='new-connection')newConnectionModal();else if(a==='test-connection')toast('Connection successful in 1.2 seconds','success');else if(a==='finish-connection'){closeModal();toast('Connection saved','success')}else if(a==='explain'||a==='explain-runtime')explainModal();else if(a==='deploy-review')deployReviewModal();else if(a==='deploy-now'){closeModal();toast('Deployment started','success');go('observability')}else if(a==='run-query')toast('Query completed · 100 rows in 1.2s','success');else if(a==='format-query')toast('Query formatted');else if(a==='ai-suggest')toast('AI suggestion generated','success');else if(a==='open-run')runDetailModal();else if(a==='rerun'){closeModal();toast('Explicit re-run started','success')}else if(a==='start-tour')tutorialStart();else if(a==='templates')templateGalleryModal();else if(a==='validate-graph')toast('Graph model is valid · 0 warnings','success');else if(a==='new-asset')go('create');else if(a==='pipeline-run')toast('Pipeline run started','success');else if(a==='agent-studio')agentStudioModal();else if(a==='new-experiment')toast('Experiment draft created','success');else if(a==='lesson')lessonModal();else if(a==='community')toast('Community resources opened');else if(a==='use-template'){closeModal();toast('Template loaded into a new draft','success');go('create')}else if(a==='lesson-open'){closeModal();const map={'Data connections':'data','Graph modeling':'graphs','Querying':'studio','Pipelines':'pipelines','AI apps':'ai','Deployments':'deployments','Observability':'observability','Governance':'governance','Getting started':'home'};go(map[state.helpPath]||'home')}else if(a==='start-tour'){closeModal();tutorialStart();}else if(a==='save-settings')toast('Settings saved','success');else if(a==='new-secret')toast('Secret creation wizard would open');else if(a==='ingestion')schemaDriftModal();else if(a==='prompt-lab')toast('Prompt Lab opened')}
function go(route){state.route=route;history.replaceState(null,'','#'+route);render()}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette()}if(e.key==='Escape'){closeModal();document.getElementById('tour-root').innerHTML=''}});document.getElementById('sidebar-toggle').addEventListener('click',()=>{state.sidebarCollapsed=!state.sidebarCollapsed;try{localStorage.setItem('ronin.sidebarCollapsed',state.sidebarCollapsed?'1':'0')}catch(e){}applySidebarState();renderNav();bindNavOnly()});
function bindNavOnly(){document.querySelectorAll('#nav [data-route]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.route)));document.querySelectorAll('#nav [data-navtab-group]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();state.tabs[el.dataset.navtabGroup]=el.dataset.navtab;render()}))}
document.getElementById('global-search').addEventListener('click',commandPalette);document.querySelectorAll('.topbar [data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action)));document.getElementById('workspace-switch').addEventListener('click',()=>showModal(`<div class="modal-head"><div class="modal-title">Switch Workspace</div><div class="spacer"></div><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body">${[['Default Workspace','demo@ronin.ai'],['Acme Analytics','customer-intelligence'],['Risk Lab','fraud-research']].map((x,i)=>`<div class="list-item ${i===0?'active':''}"><div class="avatar-sq">${x[0][0]}</div><div><strong class="small">${x[0]}</strong><div class="tiny muted">${x[1]}</div></div><div class="spacer"></div>${i===0?'✓':''}</div>`).join('')}<button class="btn" style="width:100%;margin-top:10px">+ Create workspace</button></div>`,'small'));
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if((navItems.some(x=>x[0]===h)||h==='help')&&h!==state.route){state.route=h;render()}});const hash=location.hash.replace('#','');if(navItems.some(x=>x[0]===hash)||hash==='help')state.route=hash;render();
</script>

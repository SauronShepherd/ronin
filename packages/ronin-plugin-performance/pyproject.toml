[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-plugin-performance"
version = "0.1.0"
description = "Performance Studio for Ronin runtimes and data assets"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."ronin.plugins.v1"]
performance = "ronin_plugin_performance.plugin:factory"

[project.scripts]
performance-studio = "ronin_plugin_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ronin_plugin_performance = ["ui_manifest.json", "config_schema.json"]

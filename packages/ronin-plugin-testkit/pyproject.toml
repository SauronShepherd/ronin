[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronin-plugin-testkit"
version = "0.1.0"
description = "Public contract testkit for Ronin third-party plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ronin-studio>=0.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

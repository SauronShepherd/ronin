[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyronin"
version = "0.1.0a2"
description = "Official Python SDK for the Ronin control plane."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SauronShepherd/ronin"
Repository = "https://github.com/SauronShepherd/ronin"
Issues = "https://github.com/SauronShepherd/ronin/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

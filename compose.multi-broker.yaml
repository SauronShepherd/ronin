services:
  streaming-broker-0:
    image: redpandadata/redpanda:v24.2.18@sha256:0270951e8793c77f0dd9178d137198018fa7ffd920e5a2a3b02a050ec76195b8
    profiles: ["qualification-multi-broker"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://streaming-broker-0:9092,external://127.0.0.1:${RONIN_KAFKA_PORT_0:-19092}
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - streaming-broker-0:33145
    ports:
      - "127.0.0.1:${RONIN_KAFKA_PORT_0:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  streaming-broker-1:
    image: redpandadata/redpanda:v24.2.18@sha256:0270951e8793c77f0dd9178d137198018fa7ffd920e5a2a3b02a050ec76195b8

      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://streaming-broker-2:9092,external://127.0.0.1:${RONIN_KAFKA_PORT_2:-19094}

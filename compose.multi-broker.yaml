      - --overprovisioned
      - --node-id
      - "1"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://streaming-broker-1:9092,external://127.0.0.1:${RONIN_KAFKA_PORT_1:-19093}
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - streaming-broker-1:33145
      - --seeds
      - streaming-broker-0:33145
    ports:
      - "127.0.0.1:${RONIN_KAFKA_PORT_1:-19093}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  streaming-broker-2:

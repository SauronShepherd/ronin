image:
  repository: ronin
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
storage:
  size: 1Gi
  accessModes: [ReadWriteOnce]
server:
  replicas: 1
  token: ""
  tokenScopes: '{}'
  profile: single-node
  multiUser:
    enabled: false
    postgresDsnSecret:
      name: ""
      key: dsn

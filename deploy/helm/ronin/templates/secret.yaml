apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ronin.fullname" . }}
type: Opaque
stringData:
  token: {{ required "server.token must be set" .Values.server.token | quote }}
  {{- if eq .Values.server.storageBackend "postgres" }}
  postgres-dsn: {{ required "server.postgresDsn must be set when server.storageBackend=postgres" .Values.server.postgresDsn | quote }}
  {{- end }}

apiVersion: apps/v1
kind: Deployment
{{- if or (and (gt (.Values.server.replicas | int) 1) (ne .Values.server.profile "multi-user")) (and (eq .Values.server.profile "multi-user") (not .Values.server.multiUser.enabled)) }}
{{- fail "multi-user profile or replicas > 1 requires multiUser.enabled=true and PostgreSQL-backed storage" }}
{{- end }}
metadata:
  name: {{ include "ronin.fullname" . }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ronin.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ronin.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ronin", "serve"]
          env:
            - name: RONIN_DB
              value: /var/lib/ronin/ronin.sqlite3
            - name: RONIN_DATA_DIR
              value: /var/lib/ronin
            - name: RONIN_HOST
              value: 0.0.0.0
            - name: RONIN_PORT
              value: "8080"
            - name: RONIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ronin.fullname" . }}
                  key: token
            - name: RONIN_TOKEN_SCOPES
              value: {{ .Values.server.tokenScopes | quote }}
            {{- if .Values.server.multiUser.enabled }}
            - name: RONIN_STORAGE_BACKEND
              value: postgres
            - name: RONIN_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "server.multiUser.postgresDsnSecret.name is required" .Values.server.multiUser.postgresDsnSecret.name }}
                  key: {{ .Values.server.multiUser.postgresDsnSecret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/ronin
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ronin.fullname" . }}-data

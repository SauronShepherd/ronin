name: ronin

x-ronin-environment: &ronin-environment
  RONIN_DB: /var/lib/ronin/ronin.sqlite3
  RONIN_TOKEN: ${RONIN_TOKEN:?set RONIN_TOKEN before starting Ronin}
  RONIN_TOKEN_SCOPES: '{"version":1,"grants":[{"version":1,"actions":["read","list","events","submit","execute","cancel","evidence:read"],"resource":{"kind":"project","identifier":"examples/demo"},"constraints":{}}]}'

services:
  server:
    image: ${RONIN_IMAGE_REF:-ronin:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["ronin", "serve"]
    user: "0:0"
    environment:
      <<: *ronin-environment
      RONIN_DATA_DIR: /var/lib/ronin
      RONIN_HOST: 0.0.0.0
      RONIN_PORT: "8080"
      RONIN_BIND_POLICY: container-internal
      RONIN_SQL_PARQUET_ROOT: ${RONIN_SQL_PARQUET_ROOT:-}
    volumes:
      - ronin-data:/var/lib/ronin
    ports:
      - "127.0.0.1:${RONIN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/ronin/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 2s
    restart: unless-stopped

  runner-broker:
    image: ${RONIN_IMAGE_REF:-ronin:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["ronin-runner-broker"]
    user: "0:0"
    environment:
      RONIN_DATA_DIR: /var/lib/ronin
      RONIN_IMAGE_REF: ${RONIN_IMAGE_REF:-ronin:local}
      RONIN_RUNNER_BROKER_HOST: 0.0.0.0
      RONIN_RUNNER_BROKER_PORT: "8090"
      RONIN_RUNNER_BROKER_TOKEN: ${RONIN_RUNNER_BROKER_TOKEN:?set RONIN_RUNNER_BROKER_TOKEN before starting Ronin}
    volumes:
      - ronin-data:/var/lib/ronin
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 2s
    restart: unless-stopped

  worker:
    image: ${RONIN_IMAGE_REF:-ronin:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["ronin-broker-worker"]
    user: "0:0"
    environment:
      <<: *ronin-environment
      RONIN_DATA_DIR: /var/lib/ronin
      RONIN_WORKSPACE: /workspace
      RONIN_WORKER_OWNER: compose-worker
      RONIN_RUNNER_BROKER_URL: http://runner-broker:8090
      RONIN_RUNNER_BROKER_TOKEN: ${RONIN_RUNNER_BROKER_TOKEN:?set RONIN_RUNNER_BROKER_TOKEN before starting Ronin}
      RONIN_RUNNER_BROKER_ALLOW_INSECURE: "true"
      RONIN_IMAGE_REF: ${RONIN_IMAGE_REF:-ronin:local}
      RONIN_ARTIFACT_BACKEND: ${RONIN_ARTIFACT_BACKEND:-local}
      RONIN_S3_BUCKET: ${RONIN_S3_BUCKET:-}
      RONIN_S3_PREFIX: ${RONIN_S3_PREFIX:-ronin/artifacts}
      RONIN_S3_ENDPOINT_URL: ${RONIN_S3_ENDPOINT_URL:-}
      RONIN_S3_REGION: ${RONIN_S3_REGION:-}
    volumes:
      - ronin-data:/var/lib/ronin
      - .:/workspace:ro
    depends_on:
      server:
        condition: service_healthy
      runner-broker:
        condition: service_healthy
    restart: "no"

  cli:
    image: ${RONIN_IMAGE_REF:-ronin:local}
    profiles: ["tools"]
    command: ["ronin", "--help"]
    environment:
      <<: *ronin-environment
      RONIN_URL: http://server:8080
      RONIN_BIND_POLICY: container-internal
    volumes:
      - .:/workspace:ro
    depends_on:
      server:
        condition: service_healthy
    restart: "no"

volumes:
  ronin-data:

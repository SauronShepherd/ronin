services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --debug
      - /data/debug.log
    ports:
      - "127.0.0.1:${RONIN_AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
volumes:
  azurite-data:

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Studio</title><link rel="stylesheet" href="cloud-studio.css"></head><body><header><strong>Cloud Studio</strong><span>Local cloud emulator</span><button id="undo">Undo</button><button id="redo">Redo</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset">100%</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="layout">Auto-layout</button><button id="import">Import JSON</button><button id="export-json">Export JSON</button><button id="validate">Validate</button><button id="export">Export Terraform</button><input id="file" type="file" accept="application/json" hidden></header><main><aside><h2>Components</h2><p>Drag onto canvas. Shift-click two nodes to connect them.</p><div id="palette"></div></aside><section><div class="canvas" id="canvas" tabindex="0" role="application" aria-label="Cloud topology canvas"><svg id="edges" aria-hidden="true"></svg><div class="empty">Drop cloud components here</div></div><pre id="output" hidden></pre></section><aside class="inspector"><h2>Inspector</h2><label>Name<input id="name" disabled></label><label>Property value<input id="value" disabled></label><button id="save" disabled>Save node</button><div id="status" role="status"></div></aside></main><script src="cloud-studio.js"></script></body></html>

name: Status consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/product/PUBLIC_V1_IMPLEMENTATION_STATUS.md"
      - "docs/product/public-v1-status.json"
      - "tools/generate_public_v1_status.py"
      - "docs/ui/**"
      - ".github/workflows/status-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledgers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The ledger checker validates bounded ancestry, so the observed SHA
          # must be present even when it is not the tip of this checkout.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate Public v1 status ledgers
        run: python tools/generate_public_v1_status.py --check
      - name: Validate machine ledger JSON
        run: python -m json.tool docs/product/public-v1-status.json >/dev/null
      - name: Emit normalized status-consistency release evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.emit_release_evidence \
            --gate-id status-consistency \
            --commit "${GITHUB_SHA}" \
            --status passed \
            --fingerprint "github-actions-status-${RUNNER_OS}-python-3.11" \
            --command "Public v1 status ledger consistency checks" \
            --artifact docs/product/public-v1-status.json \
            --output status-consistency-release-evidence.json
      - name: Upload status-consistency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: status-consistency-release-evidence
          path: status-consistency-release-evidence.json
          if-no-files-found: ignore

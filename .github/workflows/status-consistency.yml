name: Status consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/product/PUBLIC_V1_IMPLEMENTATION_STATUS.md"
      - "docs/product/public-v1-status.json"
      - "tools/generate_public_v1_status.py"
      - "docs/ui/**"
      - ".github/workflows/status-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledgers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The ledger checker validates bounded ancestry, so the observed SHA
          # must be present even when it is not the tip of this checkout.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate Public v1 status ledgers
        run: python tools/generate_public_v1_status.py --check
      - name: Validate machine ledger JSON
        run: python -m json.tool docs/product/public-v1-status.json >/dev/null

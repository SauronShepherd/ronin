name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check python tests tools
      - name: Lint
        run: ruff check python tests tools
      - name: Types
        run: mypy python tools
      - name: Architecture contracts
        run: python -m tools.architecture_gate python
      - name: Tests
        run: python -m pytest

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Mutation tests
        run: mutmut run
      - name: Export mutation evidence
        run: mutmut export-cicd-stats
      - name: Mutation score gate
        run: python -m tools.mutation_gate mutants/mutmut-cicd-stats.json

  gates-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

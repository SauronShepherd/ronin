name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/multi-project-runtime-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical Ruff format on temporary branch
        run: |
          ruff format tests/test_projects.py
          if ! git diff --quiet -- tests/test_projects.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_projects.py
            git commit -m "style(core): apply ruff formatting"
            git push origin HEAD:automation/multi-project-runtime-contracts
          fi
      - name: Verify project domain format
        run: ruff format --check python/studio_core/projects.py tests/test_projects.py

  gates-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

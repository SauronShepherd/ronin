name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Format
        run: ruff format --check python tests tools packages docker
      - name: Lint
        run: ruff check python tests tools packages docker
      - name: Types
        run: mypy python tools packages/pyronin/src docker
      - name: Architecture contracts
        run: python -m tools.architecture_gate python

  test-matrix:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Tests and tier coverage
        run: make test

  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Python matrix entry
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  gates-negative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Acceptance journey slot
        run: python -m pytest tests/e2e -m e2e -v

  verification:
    name: verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Create clean verification environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-verify
          source .venv-verify/bin/activate
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Run clean make check
        shell: bash
        run: |
          source .venv-verify/bin/activate
          time make check
      - name: Run acceptance skeleton
        shell: bash
        run: |
          source .venv-verify/bin/activate
          python -m pytest tests/e2e -m e2e -v
      - name: Prove demo regeneration is byte-identical
        shell: bash
        run: |
          source .venv-verify/bin/activate
          python examples/demo/build_fixture.py
          git diff --exit-code examples/demo/

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Prepare mutation source alias
        run: |
          rm -rf mutants
          test ! -e src
          test ! -L src
          ln -s python src
      - name: Run mutation tests
        run: mutmut run
      - name: Export mutation evidence
        run: mutmut export-cicd-stats
      - name: Report mutation evidence
        run: |
          cat mutants/mutmut-cicd-stats.json
          mutmut results | tee mutants/mutmut-results.txt
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-evidence
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-results.txt
          if-no-files-found: error
          retention-days: 7
      - name: Mutation score gate
        run: python -m tools.mutation_gate mutants/mutmut-cicd-stats.json
      - name: Cleanup mutation source alias
        if: always()
        run: rm -f src

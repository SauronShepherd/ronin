name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Format
        run: ruff format --check python tests tools packages docker
      - name: Lint
        run: ruff check python tests tools packages docker
      - name: Types
        run: mypy python tools packages/pyronin/src docker
      - name: Architecture contracts
        run: python -m tools.architecture_gate python
      - name: Build changed-surface manifest
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi
          test -n "$base"
          python -m tools.changed_surface "$base" "$GITHUB_SHA" --output changed-surface.json
      - name: Upload changed-surface manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: changed-surface-manifest
          path: changed-surface.json
          if-no-files-found: error
          retention-days: 14

  plugin-testkit-clean-room:
    name: third-party plugin testkit clean-room
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build host and public testkit artifacts
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir /tmp/ronin-host-dist .
          python -m build --wheel --outdir /tmp/ronin-testkit-dist packages/ronin-plugin-testkit
      - name: Install and exercise testkit outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/ronin-plugin-testkit-venv
          /tmp/ronin-plugin-testkit-venv/bin/python -m pip install --disable-pip-version-check \
            /tmp/ronin-host-dist/*.whl /tmp/ronin-testkit-dist/*.whl
          cd /tmp
          /tmp/ronin-plugin-testkit-venv/bin/python - <<'PY'
          from ronin_plugin_testkit import assert_plugin_ready
          from studio_plugin_sdk import PluginManifest

          class ExternalPlugin:
              manifest = PluginManifest(
                  id="com.example.cleanroom",
                  name="Clean-room example",
                  version="1.0.0",
                  plugin_api="1.0",
                  capabilities=("example.read",),
                  permissions=("example:read",),
              )

              def register(self, context):
                  context.contributions.add_route(
                      "GET", "/v1/example", context.plugin_id, self.handle,
                      permission="example:read",
                  )

              def startup(self):
                  pass

              def shutdown(self):
                  pass

              def handle(self, **_kwargs):
                  return {"status": "ok"}

          report = assert_plugin_ready(ExternalPlugin())
          assert report.routes == (("GET", "/v1/example"),)
          PY

  test-matrix:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Tests and tier coverage
        run: make test
      - name: Export tier coverage evidence
        run: coverage json -o coverage-tier-evidence.json
      - name: Upload tier coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-tier-${{ matrix.python-version }}
          path: coverage-tier-evidence.json
          if-no-files-found: error
          retention-days: 7

  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Python matrix entry
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  gates-negative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

  acceptance-progress:
    name: v0.1 acceptance progress (non-blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Run frozen acceptance scaffold for progress telemetry
        run: |
          python -m pytest tests/e2e -m e2e -v --junitxml=/tmp/v01-acceptance.xml
          python -m tools.v01_acceptance_gate /tmp/v01-acceptance.xml \
            --progress-only \
            --evidence-json=/tmp/v01-acceptance-progress.json
      - name: Upload acceptance progress evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v01-acceptance-progress
          path: /tmp/v01-acceptance-progress.json
          if-no-files-found: error
          retention-days: 7

  verification:
    name: verification
    runs-on: ubuntu-24.04
    env:
      VERIFY_VENV: /tmp/ronin-verify-venv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22.x"
      - name: Create clean verification environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VERIFY_VENV"
          case "$(realpath -m "$VERIFY_VENV")/" in
            "$(realpath "$GITHUB_WORKSPACE")/"*)
              echo "verification environment must be outside the Git workspace" >&2
              exit 1
              ;;
          esac
          python -m venv "$VERIFY_VENV"
          source "$VERIFY_VENV/bin/activate"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Prove installed packages import in the clean environment
        shell: bash
        run: |
          source "$VERIFY_VENV/bin/activate"
          python -m tools.public_import_smoke
      - name: Run acceptance scaffold without release claim
        shell: bash
        run: |
          source "$VERIFY_VENV/bin/activate"
          python -m pytest tests/e2e -m e2e -v --junitxml=/tmp/v01-verification.xml
          python -m tools.v01_acceptance_gate /tmp/v01-verification.xml --progress-only
      - name: Prove demo regeneration is byte-identical
        shell: bash
        run: |
          source "$VERIFY_VENV/bin/activate"
          python examples/demo/build_fixture.py
          git diff --exit-code examples/demo/
      - name: Prove verifier artifacts are outside captured workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.venv-verify"
          test -z "$(git ls-files --others --exclude-standard -- .venv-verify)"
          case "$(realpath "$VERIFY_VENV")/" in
            "$(realpath "$GITHUB_WORKSPACE")/"*)
              echo "verification environment contaminated Git workspace" >&2
              exit 1
              ;;
          esac
      - name: Run full clean make check on nightly/manual qualification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          source "$VERIFY_VENV/bin/activate"
          time make check

  ci-evidence:
    if: always()
    needs:
      - quality
      - plugin-testkit-clean-room
      - test-matrix
      - test
      - gates-negative
      - acceptance-progress
      - verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Require every CI gate to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.plugin-testkit-clean-room.result }}" \
            "${{ needs.test-matrix.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.gates-negative.result }}" \
            "${{ needs.acceptance-progress.result }}" \
            "${{ needs.verification.result }}"; do
            test "$result" = success || {
              echo "CI gate result was $result" >&2
              exit 1
            }
          done
          printf '%s\n' "all CI jobs passed" > ci-qualification.txt
          python -m tools.emit_release_evidence \
            --gate-id ci \
            --commit "${GITHUB_SHA}" \
            --status passed \
            --fingerprint "github-actions-ci-${RUNNER_OS}" \
            --command "all CI workflow jobs" \
            --artifact ci-qualification.txt \
            --output ci-release-evidence.json
      - uses: actions/upload-artifact@ea165f8f65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-release-evidence
          path: |
            ci-qualification.txt
            ci-release-evidence.json
          if-no-files-found: error
          retention-days: 30

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/packages/pyronin/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --editable .
          python -m pip install -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Prepare mutation source alias
        run: |
          rm -rf mutants
          test ! -e src
          test ! -L src
          ln -s python src
      - name: Run mutation tests
        run: mutmut run
      - name: Export mutation evidence
        run: mutmut export-cicd-stats
      - name: Report mutation evidence
        run: |
          cat mutants/mutmut-cicd-stats.json
          mutmut results | tee mutants/mutmut-results.txt
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-evidence
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-results.txt
            mutants/mutation-release-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Mutation score gate
        run: python -m tools.mutation_gate mutants/mutmut-cicd-stats.json
      - name: Emit normalized mutation release evidence
        run: >-
          python -m tools.emit_release_evidence
          --gate-id mutation
          --commit "${{ github.sha }}"
          --status passed
          --fingerprint "github-actions-mutation-${{ runner.os }}-python-3.11"
          --command "mutmut run && python -m tools.mutation_gate mutants/mutmut-cicd-stats.json"
          --artifact mutants/mutmut-cicd-stats.json
          --artifact mutants/mutmut-results.txt
          --output mutants/mutation-release-evidence.json
      - name: Cleanup mutation source alias
        if: always()
        run: rm -f src

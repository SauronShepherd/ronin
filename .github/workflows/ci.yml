name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format project domain
        run: ruff format --check python/studio_core/projects.py
      - name: Format project tests
        run: ruff format --check tests/test_projects.py
      - name: Format existing sources
        run: ruff format --check python/studio_core/__init__.py python/studio_core/ids.py python/studio_core/ir.py tests/test_core_ir.py tests/test_architecture.py tools
      - name: Lint
        run: ruff check python tests tools
      - name: Types
        run: mypy python tools
      - name: Architecture contracts
        run: python -m tools.architecture_gate python
      - name: Tests
        run: python -m pytest

  gates-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

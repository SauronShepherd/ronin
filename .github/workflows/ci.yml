name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check python tests tools
      - name: Lint project domain
        run: ruff check python/studio_core/projects.py
      - name: Lint project tests
        run: ruff check tests/test_projects.py
      - name: Lint existing sources
        run: ruff check python/studio_core/__init__.py python/studio_core/ids.py python/studio_core/ir.py tests/test_core_ir.py tests/test_architecture.py tools

  gates-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove architecture gate rejects deliberate violations
        run: python -m tools.gates_negative

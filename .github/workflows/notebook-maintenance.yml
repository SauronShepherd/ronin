name: Notebook maintenance helper

on:
  push:
    branches:
      - feat/notebook-portable-format

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Append durable records and normalize Python
        env:
          ADR_APPEND_B64: 
          PROGRESS_APPEND_B64: 
        run: |
          python -c "import base64, os, pathlib; p=pathlib.Path('docs/automation/DECISIONS.md'); t=base64.b64decode(os.environ['ADR_APPEND_B64']).decode(); s=p.read_text(); p.write_text(s if 'ADR-AUTO-015' in s else s+t)"
          python -c "import base64, os, pathlib; p=pathlib.Path('docs/automation/PROGRESS.md'); t=base64.b64decode(os.environ['PROGRESS_APPEND_B64']).decode(); s=p.read_text(); p.write_text(s if 'E1 portable notebook identity and serialization' in s else s+t)"
          ruff check --fix python tests tools
          ruff format python tests tools
      - name: Commit normalized candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add python tests docs/automation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(notebook): normalize portable document slice'
          git push

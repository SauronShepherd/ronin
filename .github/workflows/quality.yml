name: Ronin quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install hash-locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .

      - name: Run canonical quality gates
        run: make check PYTHON=python

  browser-quality:
    name: Chromium non-live regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tests/package-lock.json

      - name: Install locked browser dependencies
        working-directory: web-tests
        run: npm ci

      - name: Install Chromium
        working-directory: web-tests
        run: npx playwright install chromium

      - name: Run non-live browser suite
        working-directory: web-tests
        run: npm test -- --workers=1

  cloud-studio-terraform:
    name: Cloud Studio Terraform / Floci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install hash-locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Start pinned Floci
        run: docker compose -f examples/cloud-studio/compose.floci.yaml -p ronin-cloud-studio-ci up -d floci

      - name: Run real Cloud Studio Terraform qualification
        run: |
          rm -rf .tmp/cloud-studio-ci
          mkdir -p .tmp/cloud-studio-ci
          python tools/cloud_studio_floci_qualification.py \
            --backend floci \
            --terraform \
            --command-timeout-seconds 300 \
            --workspace .tmp/cloud-studio-ci

      - name: Clean up Floci
        if: always()
        run: docker compose -f examples/cloud-studio/compose.floci.yaml -p ronin-cloud-studio-ci down --volumes --remove-orphans

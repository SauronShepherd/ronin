name: Ronin quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install hash-locked test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .

      - name: Run canonical quality gates
        run: make check PYTHON=python

  browser-quality:
    name: Chromium non-live regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tests/package-lock.json

      - name: Install locked browser dependencies
        working-directory: web-tests
        run: npm ci

      - name: Install Chromium
        working-directory: web-tests
        run: npx playwright install --with-deps chromium

      - name: Run non-live browser suite
        working-directory: web-tests
        run: npm test -- --workers=2

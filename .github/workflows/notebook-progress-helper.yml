name: Notebook progress helper

on:
  push:
    branches:
      - feat/notebook-portable-format

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append validation evidence
        env:
          APPEND_B64: 
        run: |
          python -c "import base64, os, pathlib; p=pathlib.Path('docs/automation/PROGRESS.md'); t=base64.b64decode(os.environ['APPEND_B64']).decode(); s=p.read_text(); p.write_text(s if '33734983351' in s else s+t)"
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/automation/PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: record notebook portability validation'
          git push

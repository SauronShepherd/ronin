name: Phase 10 progress append

on:
  push:
    branches: [chore/v01-scope-freeze]
    paths: [".github/workflows/phase10-progress-append.yml"]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/v01-scope-freeze
      - name: Append progress and self-remove
        env:
          PROGRESS_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PROGRESS_B64" | base64 --decode >> docs/automation/PROGRESS.md
          git rm .github/workflows/phase10-progress-append.yml
          git config user.name "Ronin Autonomous Builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/automation/PROGRESS.md
          git commit -m "docs(automation): record v0.1 scope-freeze day gate"
          git push origin HEAD:chore/v01-scope-freeze

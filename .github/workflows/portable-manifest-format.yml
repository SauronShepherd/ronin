name: Portable manifest format helper

on:
  push:
    branches:
      - feat/portable-project-manifest

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-project-manifest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical formatter
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add python tests
          git commit -m 'style: apply canonical Ruff formatting [ruff-format]'
          git push

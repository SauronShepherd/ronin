name: Phase 9 milestone

on:
  push:
    branches: [chore/v01-scope-freeze]
    paths: [".github/workflows/phase9-milestone.yml"]

permissions:
  contents: write
  issues: write

jobs:
  milestone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/v01-scope-freeze
      - name: Create milestone, assign issues, and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          milestone_number="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --jq '.[] | select(.title == "v0.1.0") | .number' | head -n1)"
          if [ -z "$milestone_number" ]; then
            milestone_number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/milestones" -f title='v0.1.0' -f due_on='2026-11-01T23:59:59Z' -f description='Ronin v0.1.0 release milestone; Week-1 proving issues are attached by the 2026-09-05 day plan.' --jq '.number')"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$milestone_number" -f due_on='2026-11-01T23:59:59Z' >/dev/null
          fi
          for issue in $(seq 75 86); do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -F milestone="$milestone_number" >/dev/null
          done
          git rm .github/workflows/phase9-milestone.yml
          git config user.name "Ronin Autonomous Builder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(project): assign week 1 issues to v0.1.0 milestone"
          git push origin HEAD:chore/v01-scope-freeze

name: Runtime evidence docs helper

on:
  push:
    branches:
      - feat/runtime-reproducibility-evidence

permissions:
  contents: write

jobs:
  append-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-reproducibility-evidence
      - name: Skip recorded commit
        id: guard
        shell: bash
        run: |
          if git log -1 --format=%B | grep -Fq '[docs-recorded]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Append decision and progress
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          cat >> docs/automation/DECISIONS.md <<'EOF'

## ADR-AUTO-017 — Effective runtime reproducibility is immutable execution evidence, not authored intent

**Status:** accepted — 2026-09-03

A prepared execution now carries an explicit `ExecutionAttemptId` plus an immutable `ExecutionReproducibilitySnapshot`. Attempt identity is allocated by the orchestration boundary and passed into `studio_kernel`; the canonical contract does not manufacture clocks, randomness or provider handles. Durable events derive identity from that attempt plus a non-negative sequence so storage/replay layers can preserve a stable total order without embedding wall-clock behavior in the domain.

Effective runtime configuration is evidence produced after adapter resolution, not project or notebook authoring state. Adapters must normalize values before crossing the boundary and must never pass resolved secrets. `EffectiveRuntimeSetting` intentionally rejects names that look like common credential/token/password/API-key/private-key material as a second fail-closed defense, but this check is not a substitute for adapter-side secret classification and redaction. Raw environment dumps, provider configuration objects and credentials are not canonical execution evidence.

Reproducibility artifacts use typed SHA-256 identities for package locks, environments, runtime images and runtime artifacts. The canonical contract stores a stable reference plus digest; acquiring bytes, resolving container repository digests, hashing artifacts and verifying remote/provider state remain adapter responsibilities. Duplicate setting names and duplicate digest kind/reference pairs fail closed so evidence cannot silently become ambiguous.

This adapts proven ideas from `sdp-studio` artifact hashing/runtime-profile safety and `ronin-old` secret-redaction and immutable base-image inspection without copying provider-specific execution or mutable runtime state into the canonical model. The next execution slice should consume these contracts through a real session adapter with cancellation, isolation, permission checks, redacted durable event emission and resource/cost/trace linkage.
EOF

          cat >> docs/automation/PROGRESS.md <<'EOF'

## 2026-09-03 — E1 runtime reproducibility evidence

Objective: make a notebook execution explainable and replayable beyond runtime-profile selection by binding the attempt to effective non-secret configuration and immutable environment/package/image identities, while also adding the supplied Ronin brand asset to the public README.

Implemented on validation branch `feat/runtime-reproducibility-evidence` / PR #15:

- Added explicit durable `ExecutionAttemptId` and deterministic `ExecutionEventId(attempt, sequence)` contracts; identity allocation remains an orchestration concern rather than using clocks/randomness inside `studio_kernel`.
- Added canonical `EffectiveRuntimeSetting` evidence for adapter-normalized non-secret effective configuration. Obvious credential/password/token/API-key/private-key names fail closed, while adapters remain responsible for classification/redaction before the boundary.
- Added typed SHA-256 `ReproducibilityDigest` evidence for package locks, environments, runtime images and runtime artifacts, with canonical ordering and duplicate-key rejection.
- Bound `NotebookExecutionRequest` to both the explicit attempt identity and `ExecutionReproducibilitySnapshot`, preserving authored notebook/project intent unchanged.
- Added adversarial tests for secret-looking setting names, malformed identities/digests, duplicate evidence, all supported digest kinds and request binding. The existing strict typing, architecture, 100% line/branch coverage and mutation gates were not reduced.
- Reused `sdp-studio` artifact-hash/runtime-safety concepts and `ronin-old` redaction/base-image-lock patterns as evidence while keeping provider/runtime I/O behind adapters.
- Added the user-supplied Ronin logo as `docs/assets/ronin-logo.webp` and surfaced it at the top of `README.md`.

Validation history:

1. PR run `33743098636` exposed only canonical Ruff formatting drift in the new digest check; the exact formatter output was applied without changing a gate.
2. PR run `33743206537` then passed format but Ruff correctly rejected two constructed default arguments in a test helper (`B008`). The helper was redesigned with explicit optional values and a concrete request return type; no lint suppression was added.
3. Product-code HEAD `c1d8b6c20b2dec6f43a8f1888181013532ee65e4`, PR CI run `33743273629`, passed Format, Lint, strict Types, Architecture contracts, Tests with the mandatory 100% line/branch coverage gate, `gates-negative`, and the existing mutation score gate.
4. This documentation record and removal of its temporary branch-only helper require another authoritative exact-head PR CI before publication. Post-`main` evidence is only claimed after the published SHA completes required workflows successfully.

Next E1 priority: implement the first real kernel/session adapter boundary with cancellation, isolation, permission enforcement, redaction and durable ordered event/evidence emission, then attach concrete local/container reproducibility collectors behind the neutral contracts.
EOF
      - name: Commit records
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/automation/DECISIONS.md docs/automation/PROGRESS.md
          git commit -m 'docs: record runtime reproducibility evidence [docs-recorded]'
          git push

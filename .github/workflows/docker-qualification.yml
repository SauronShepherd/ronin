name: Docker qualification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ronin
          POSTGRES_USER: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ronin with data-plane dependencies
        run: python -m pip install --editable ".[data-plane,open-tables,ml,security,streaming,dev]"

      - name: Run non-Docker qualification suite
        env:
          RONIN_POSTGRES_TEST_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_TEST_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_CONNECTOR_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          PG_QUAL_USER: ronin
          PG_QUAL_PASSWORD: ronin
          RONIN_PERFORMANCE_ARTIFACT: ${{ github.workspace }}/qualification-evidence/http-performance.json
        run: >-
          python -m pytest -q
          --ignore=tests/perf
          --ignore=tests/integration/test_docker_container_executor_real.py
          --ignore=tests/integration/test_worker_runtime_real.py

      - name: Run PostgreSQL-backed storage coverage gate
        env:
          RONIN_POSTGRES_TEST_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_TEST_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          PYTHONUNBUFFERED: "1"
        run: |
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            python -m pytest -q --ignore=tests/perf --cov --cov-branch --cov-report=
          make coverage-storage-files-full

      - name: Build pinned qualification image
        run: docker build --file docker/Dockerfile.probe --tag ronin-probe:ci .

      - name: Resolve qualification image digest
        run: echo "RONIN_DOCKER_QUALIFICATION_IMAGE=$(docker image inspect ronin-probe:ci --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Run real Docker qualification
        env:
          RONIN_REAL_DOCKER_QUALIFICATION: "1"
          RONIN_DOCKER_QUALIFICATION_EVIDENCE: ${{ github.workspace }}/qualification-evidence
          RONIN_HOST_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p qualification-evidence
          python -m pytest -q tests/integration/test_docker_container_executor_real.py tests/integration/test_worker_runtime_real.py

      - name: Emit normalized Docker release evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=(qualification-evidence/*.json)
          test -e "${evidence[0]}"
          artifact_args=()
          for path in "${evidence[@]}"; do
            artifact_args+=(--artifact "$path")
          done
          python -m tools.emit_release_evidence \
            --gate-id docker-qualification \
            --commit "${GITHUB_SHA}" \
            --status passed \
            --fingerprint "github-actions-docker-${RUNNER_OS}" \
            --command "pytest real Docker qualification" \
            "${artifact_args[@]}" \
            --output qualification-evidence/docker-release-evidence.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-qualification-evidence
          path: qualification-evidence
          if-no-files-found: ignore

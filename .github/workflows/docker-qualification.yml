name: Docker qualification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-docker-qualification:
    name: non-docker-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ronin
          POSTGRES_USER: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      localstack:
        image: localstack/localstack@sha256:f3cb1a79f3add997575e859c3a2808e6dae4b0de836661de255baa2b576868f8
        env:
          SERVICES: s3
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ronin with data-plane dependencies
        run: python -m pip install --editable ".[data-plane,open-tables,ml,security,streaming,dev]"
      - name: Run non-Docker qualification suite
        env:
          RONIN_POSTGRES_TEST_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_TEST_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_CONNECTOR_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          PG_QUAL_USER: ronin
          PG_QUAL_PASSWORD: ronin
          RONIN_PERFORMANCE_ARTIFACT: ${{ github.workspace }}/qualification-evidence/http-performance.json
        run: |
          mkdir -p qualification-evidence
          python -m pytest -q \
            --ignore=tests/perf \
            --ignore=tests/integration/test_docker_container_executor_real.py \
            --ignore=tests/integration/test_worker_runtime_real.py
      - name: Qualify ML artifact lifecycle against S3-compatible storage
        env:
          RONIN_TEST_S3_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest -q tests/integration/test_ml_s3_artifact_store_real.py
      - name: Upload general qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-qualification-general-evidence
          path: qualification-evidence/*.json
          if-no-files-found: ignore

  postgres-storage-coverage:
    name: postgres-storage-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ronin
          POSTGRES_USER: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ronin with data-plane dependencies
        run: python -m pip install --editable ".[data-plane,open-tables,ml,security,streaming,dev]"
      - name: Run PostgreSQL-backed storage coverage gate
        env:
          RONIN_POSTGRES_TEST_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          RONIN_TEST_POSTGRES_DSN: postgresql://ronin:ronin@localhost:5432/ronin
          PYTHONUNBUFFERED: "1"
        run: |
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            python -m pytest -q --ignore=tests/perf --cov --cov-branch --cov-report=
          make coverage-storage-files-full

  docker-runtime-acceptance:
    name: docker-runtime-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ronin
          POSTGRES_USER: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ronin with data-plane dependencies
        run: python -m pip install --editable ".[data-plane,open-tables,ml,security,streaming,dev]"

      - name: Build pinned qualification image
        run: docker build --file docker/Dockerfile.probe --tag ronin-probe:ci .

      - name: Resolve qualification image digest
        run: echo "RONIN_DOCKER_QUALIFICATION_IMAGE=$(docker image inspect ronin-probe:ci --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Create isolated PostgreSQL database for real worker qualification
        env:
          PGPASSWORD: ronin
        run: |
          dropdb --if-exists --host localhost --username ronin ronin_worker_qualification
          createdb --host localhost --username ronin ronin_worker_qualification

      - name: Run real Docker qualification
        env:
          RONIN_REAL_DOCKER_QUALIFICATION: "1"
          RONIN_DOCKER_QUALIFICATION_EVIDENCE: ${{ github.workspace }}/qualification-evidence
          RONIN_HOST_WORKSPACE: ${{ github.workspace }}
          RONIN_POSTGRES_TEST_DSN: postgresql://ronin:ronin@localhost:5432/ronin_worker_qualification
        run: |
          mkdir -p qualification-evidence
          python -m pytest -q \
            tests/integration/test_docker_container_executor_real.py \
            tests/integration/test_worker_runtime_real.py \
            tests/integration/test_postgres_workflow_store_real.py::test_postgres_scheduler_daemon_replays_job_after_process_crash_without_duplicate

      - name: Build Ronin runtime image for frozen v0.1 acceptance
        run: docker build --file docker/Dockerfile --tag ronin-v01-acceptance:ci .

      - name: Resolve frozen acceptance image identity
        id: v01-image
        shell: bash
        run: |
          image="$(docker image inspect ronin-v01-acceptance:ci --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run strict frozen v0.1 acceptance
        env:
          RONIN_REAL_DOCKER_QUALIFICATION: "1"
          RONIN_DOCKER_QUALIFICATION_IMAGE: ${{ steps.v01-image.outputs.image }}
          RONIN_DOCKER_QUALIFICATION_EVIDENCE: ${{ github.workspace }}/qualification-evidence
          RONIN_HOST_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q tests/e2e -m e2e --junitxml=qualification-evidence/v01-acceptance.xml
          python -m tools.v01_acceptance_gate \
            qualification-evidence/v01-acceptance.xml \
            --evidence-json=qualification-evidence/v01-acceptance-strict.json

      - name: Upload Docker runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-qualification-runtime-evidence
          path: qualification-evidence/*.json
          if-no-files-found: ignore

  docker-qualification:
    name: docker-qualification
    if: always()
    needs:
      - non-docker-qualification
      - postgres-storage-coverage
      - docker-runtime-acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Require all parallel qualification lanes to pass
        env:
          GENERAL_RESULT: ${{ needs.non-docker-qualification.result }}
          STORAGE_RESULT: ${{ needs.postgres-storage-coverage.result }}
          RUNTIME_RESULT: ${{ needs.docker-runtime-acceptance.result }}
        run: |
          test "$GENERAL_RESULT" = success
          test "$STORAGE_RESULT" = success
          test "$RUNTIME_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download general qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-qualification-general-evidence
          path: qualification-evidence/general
      - name: Download Docker runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-qualification-runtime-evidence
          path: qualification-evidence/runtime
      - name: Emit normalized Docker release evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=(qualification-evidence/general/*.json qualification-evidence/runtime/*.json)
          test -e "${evidence[0]}"
          artifact_args=()
          for path in "${evidence[@]}"; do
            artifact_args+=(--artifact "$path")
          done
          python -m tools.emit_release_evidence \
            --gate-id docker-qualification \
            --commit "${GITHUB_SHA}" \
            --status passed \
            --fingerprint "github-actions-docker-${RUNNER_OS}" \
            --command "parallel qualification suites, real Docker, and strict v0.1 acceptance" \
            "${artifact_args[@]}" \
            --output qualification-evidence/docker-release-evidence.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-qualification-evidence
          path: qualification-evidence
          if-no-files-found: ignore

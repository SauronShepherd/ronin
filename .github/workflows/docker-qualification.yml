name: Docker qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked development dependencies
        run: python -m pip install --requirement requirements-dev.lock

      - name: Install Ronin with data-plane dependencies
        run: python -m pip install --editable ".[data-plane,dev]"

      - name: Run non-Docker qualification suite
        run: python -m pytest -q --ignore=tests/perf --ignore=tests/integration/test_docker_container_executor_real.py --ignore=tests/integration/test_worker_runtime_real.py

      - name: Build pinned qualification image
        run: docker build --file docker/Dockerfile.probe --tag ronin-probe:ci .

      - name: Run real Docker qualification
        env:
          RONIN_REAL_DOCKER_QUALIFICATION: "1"
          RONIN_DOCKER_QUALIFICATION_EVIDENCE: ${{ github.workspace }}/qualification-evidence
          RONIN_HOST_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "RONIN_DOCKER_QUALIFICATION_IMAGE=$(docker image inspect ronin-probe:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          mkdir -p qualification-evidence
          python -m pytest -q tests/integration/test_docker_container_executor_real.py tests/integration/test_worker_runtime_real.py

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-qualification-evidence
          path: qualification-evidence
          if-no-files-found: ignore

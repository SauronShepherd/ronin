name: Diagnostic lint fix

on:
  push:
    branches:
      - automation/diagnostic-contracts

permissions:
  contents: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/diagnostic-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply safe Ruff fixes
        run: ruff check . --fix
      - name: Apply canonical formatting
        run: ruff format .
      - name: Commit lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add python/studio_core/diagnostics.py python/studio_core/__init__.py tests/test_diagnostics.py
          git commit -m 'style: apply diagnostic lint fixes'
          git push origin HEAD:automation/diagnostic-contracts

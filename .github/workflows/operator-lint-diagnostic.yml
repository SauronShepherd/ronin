name: Operator lint diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Capture lint diagnostics
        run: |
          ruff check --fix python/studio_core/operators.py tests/test_operators.py > operator-lint.txt 2>&1 || true
          ruff format python/studio_core/operators.py tests/test_operators.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: operator-lint
          path: |
            operator-lint.txt
            python/studio_core/operators.py
            tests/test_operators.py

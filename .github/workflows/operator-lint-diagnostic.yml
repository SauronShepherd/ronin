name: Operator lint diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply remaining lint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("python/studio_core/operators.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if parameter.name in parameters and not _is_missing(parameters[parameter.name]):\n            if not _matches_parameter_kind(parameters[parameter.name], parameter.kind):\n                violations.append(\n                    OperatorViolation(\n                        "RONIN-OP-003",\n                        f"operator parameter has incompatible type: {parameter.name}",\n                        f"params.{parameter.name}",\n                    )\n                )\n'''
          new = '''        if (\n            parameter.name in parameters\n            and not _is_missing(parameters[parameter.name])\n            and not _matches_parameter_kind(parameters[parameter.name], parameter.kind)\n        ):\n            violations.append(\n                OperatorViolation(\n                    "RONIN-OP-003",\n                    f"operator parameter has incompatible type: {parameter.name}",\n                    f"params.{parameter.name}",\n                )\n            )\n'''
          if old not in text:
              raise SystemExit("target lint block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff check python/studio_core/operators.py tests/test_operators.py
          ruff format python/studio_core/operators.py tests/test_operators.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/studio_core/operators.py tests/test_operators.py
          git commit -m "style: satisfy operator lint contract"
          git push

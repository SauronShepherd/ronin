name: Security qualification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree with pinned Gitleaks image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner /repo
      - name: Prove the secret gate rejects a deliberate fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          printf '%s\n' 'token = "ghp_1234567890abcdefghijklmnopqrstuvwxyz"' > "$fixture/secret.txt"
          if docker run --rm \
            --volume "$fixture:/fixture:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact --no-banner /fixture; then
            echo "Gitleaks failed to reject the deliberate synthetic secret fixture." >&2
            exit 1
          fi

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install root development environment and pinned auditor
        run: python -m pip install --disable-pip-version-check -e '.[dev]' 'pip-audit==2.10.1'
      - name: Audit the installed root environment
        run: python -m pip_audit --local --skip-editable --strict --progress-spinner=off
      - name: Audit pyronin project dependencies
        run: python -m pip_audit --strict --progress-spinner=off packages/pyronin

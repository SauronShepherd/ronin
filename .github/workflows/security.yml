name: Security qualification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history and prove fail-closed detection
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          image="ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb"

          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP:/out" \
            "$image" \
            git --redact --no-banner --report-format=json --report-path=/out/gitleaks.json /repo
          repository_scan_status=$?
          set -e

          REPORT_PATH="$report" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          findings = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else []
          print(f"Gitleaks findings: {len(findings)}")
          for finding in findings:
              rule = str(finding.get("RuleID", "unknown"))
              path = str(finding.get("File", "unknown"))
              line = str(finding.get("StartLine", "unknown"))
              commit = str(finding.get("Commit", "unknown"))[:12]
              print(f"finding rule={rule} file={path} line={line} commit={commit}")
          PY

          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          printf '%s\n' 'aws_access_key_id = "AKIAZ3N7W6X5V4U2TQRS"' > "$fixture/secret.txt"
          if docker run --rm \
            --volume "$fixture:/fixture:ro" \
            "$image" \
            dir --redact --no-banner /fixture; then
            echo "Gitleaks failed to reject the deliberate synthetic secret fixture." >&2
            exit 1
          fi

          if [ "$repository_scan_status" -ne 0 ]; then
            echo "Repository secret scan failed; sanitized finding metadata is printed above." >&2
            exit "$repository_scan_status"
          fi

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install root development environment and pinned auditor
        run: python -m pip install --disable-pip-version-check -e '.[dev]' 'pip-audit==2.10.1'
      - name: Audit installed third-party root and development dependencies
        run: python -m pip_audit --strict --progress-spinner=off --local --skip-editable
      - name: Audit pyronin dependency surface
        run: python -m pip_audit --strict --progress-spinner=off packages/pyronin

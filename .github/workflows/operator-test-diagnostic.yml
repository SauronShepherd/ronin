name: Operator test diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Capture test diagnostics
        run: python -m pytest > operator-tests.txt 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: operator-tests-official
          path: operator-tests.txt

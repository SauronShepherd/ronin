name: Operator format diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical formatting
        run: ruff format python/studio_core/operators.py tests/test_operators.py
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/studio_core/operators.py tests/test_operators.py
          git commit -m "style: apply canonical operator formatting"
          git push

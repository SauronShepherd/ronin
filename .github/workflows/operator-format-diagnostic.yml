name: Operator format diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical formatting
        run: ruff format python/studio_core/operators.py tests/test_operators.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: operator-formatted
          path: |
            python/studio_core/operators.py
            tests/test_operators.py

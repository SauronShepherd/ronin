name: Operator type diagnostic

on:
  push:
    branches:
      - automation/operator-contracts

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Capture mypy diagnostics
        run: mypy python tools > operator-types.txt 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: operator-types
          path: operator-types.txt

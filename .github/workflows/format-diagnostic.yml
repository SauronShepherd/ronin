name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Capture canonical Ruff format diff
        shell: bash
        run: |
          set -euo pipefail
          ruff format --diff python tests tools packages docker > ruff-format.diff || true
          cat ruff-format.diff
      - name: Upload formatter diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-format-diff
          path: ruff-format.diff
          if-no-files-found: error
          retention-days: 1

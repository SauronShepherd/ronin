name: Release qualification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "python/**"
      - "web/**"
      - "tools/check_web_assets.py"
      - "tools/installed_studio_browser_smoke.py"
      - "tools/installed_studio_a11y.py"
      - "web-tests/**"
      - "tools/generate_sbom.py"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/release-qualification.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r third_party/qualification-tools-v1.txt
      - name: Build source and wheel artifacts
        run: python -m build
      - name: Install exact locked environment for license qualification
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Qualify exact dependency license evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/license_qualification.py | tee dist/license-qualification.txt
      - name: Check Studio source asset graph
        run: python tools/check_web_assets.py
      - name: Install Chromium for installed Studio smoke
        run: python -m playwright install --with-deps chromium
      - name: Qualify installed wheel Studio in Chromium
        run: python tools/installed_studio_browser_smoke.py dist/*.whl
      - name: Qualify installed source distribution Studio in Chromium
        run: python tools/installed_studio_browser_smoke.py dist/*.tar.gz
      - name: Install locked web accessibility tooling
        run: npm ci
      - name: Qualify installed Studio accessibility and responsive matrix
        run: python -m tools.installed_studio_a11y dist/*.whl
      - name: Qualify installed source distribution accessibility matrix
        run: python -m tools.installed_studio_a11y dist/*.tar.gz
      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Record exact artifact identity
        run: python -m tools.artifact_identity dist/*.whl dist/*.tar.gz --output dist/artifact-identity.json
      - name: Generate candidate-bound SBOM and provenance evidence
        run: >-
          python tools/generate_sbom.py
          --root .
          --output dist/ronin-sbom-provenance.json
          dist/*.whl dist/*.tar.gz
      - name: Verify candidate-bound SBOM and provenance evidence
        run: >-
          python tools/generate_sbom.py
          --verify
          --output dist/ronin-sbom-provenance.json
          dist/*.whl
      - name: Generate Python distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/python-distributions.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Emit installed-artifact release evidence and verdict
        run: >-
          python -m tools.installed_artifact_evidence
          --commit "${{ github.sha }}"
          --artifact-identity dist/artifact-identity.json
          --sbom dist/python-distributions.spdx.json
          --output dist/installed-artifact-release-evidence.json
          --verdict-output dist/installed-artifact-release-verdict.json
      - name: Install and smoke wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/ronin-wheel-venv
          /tmp/ronin-wheel-venv/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/ronin-wheel-venv/bin/python tools/public_import_smoke.py
          cd /tmp
          /tmp/ronin-wheel-venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import studio_core
          import studio_kernel
          import studio_notebook
          import studio_runners

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for package in (studio_core, studio_kernel, studio_notebook, studio_runners):
              location = Path(package.__file__).resolve()
              if location.is_relative_to(checkout):
                  raise SystemExit(f"source-tree leakage: {package.__name__} -> {location}")
          PY
      - name: Install and smoke source distribution outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/ronin-sdist-venv
          /tmp/ronin-sdist-venv/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          /tmp/ronin-sdist-venv/bin/python tools/public_import_smoke.py
          cd /tmp
          /tmp/ronin-sdist-venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import studio_core
          import studio_kernel
          import studio_notebook
          import studio_runners

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for package in (studio_core, studio_kernel, studio_notebook, studio_runners):
              location = Path(package.__file__).resolve()
              if location.is_relative_to(checkout):
                  raise SystemExit(f"source-tree leakage: {package.__name__} -> {location}")
          PY
      - name: Emit normalized installed-artifact release evidence
        run: >-
          python -m tools.emit_release_evidence
          --gate-id installed-artifact
          --commit "${{ github.sha }}"
          --status passed
          --fingerprint "github-actions-installed-artifact-${{ runner.os }}"
          --command "wheel and sdist clean-install smoke"
          --artifact dist/artifact-identity.json
          --artifact dist/python-distributions.spdx.json
          --artifact dist/installed-artifact-release-evidence.json
          --artifact dist/installed-artifact-release-verdict.json
          --output dist/installed-artifact-normalized-evidence.json
      - name: Emit normalized SBOM release evidence
        run: >-
          python -m tools.emit_release_evidence
          --gate-id sbom-provenance
          --commit "${{ github.sha }}"
          --status passed
          --fingerprint "github-actions-sbom-${{ runner.os }}"
          --command "candidate-bound SBOM and provenance qualification"
          --artifact dist/ronin-sbom-provenance.json
          --artifact dist/python-distributions.spdx.json
          --output dist/sbom-release-evidence.json
      - name: Emit normalized license release evidence
        run: >-
          python -m tools.emit_release_evidence
          --gate-id license
          --commit "${{ github.sha }}"
          --status passed
          --fingerprint "github-actions-license-${{ runner.os }}"
          --command "locked dependency license qualification"
          --artifact dist/license-qualification.txt
          --output dist/license-release-evidence.json
      - name: Emit normalized artifact identity evidence
        run: >-
          python -m tools.emit_release_evidence
          --gate-id artifact-identity
          --commit "${{ github.sha }}"
          --status passed
          --fingerprint "github-actions-artifact-identity-${{ runner.os }}"
          --command "exact wheel and sdist artifact identity"
          --artifact dist/artifact-identity.json
          --output dist/artifact-identity-release-evidence.json
      - name: Upload exact build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ronin-studio-python-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

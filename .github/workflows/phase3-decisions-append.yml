name: Phase 3 decisions append

on:
  push:
    branches: [chore/v01-scope-freeze]
    paths: [".github/workflows/phase3-decisions-append.yml"]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/v01-scope-freeze
      - name: Append decisions and self-remove
        env:
          ADRS_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$ADRS_B64" | base64 --decode >> docs/automation/DECISIONS.md
          git rm .github/workflows/phase3-decisions-append.yml
          git config user.name "Ronin Autonomous Builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/automation/DECISIONS.md
          git commit -m "docs(decisions): accept five v0.1 architecture decisions"
          git push origin HEAD:chore/v01-scope-freeze

name: Format helper

on:
  pull_request:
    paths:
      - "python/studio_kernel/**"
      - "tests/test_kernel_isolation_qualification.py"
      - ".github/workflows/format-helper.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format exact files
        run: >-
          ruff format
          python/studio_kernel/session.py
          python/studio_kernel/__init__.py
          tests/test_kernel_isolation_qualification.py
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-format
          path: |
            python/studio_kernel/session.py
            python/studio_kernel/__init__.py
            tests/test_kernel_isolation_qualification.py
          if-no-files-found: error
          retention-days: 1

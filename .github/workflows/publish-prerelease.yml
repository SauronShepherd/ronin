name: Publish prerelease artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/publish-prerelease.yml"
      - ".github/workflows/docker-qualification.yml"
      - "docker/**"
      - "packages/pyronin/**"
      - "tests/e2e/**"
      - "tools/v01_acceptance_gate.py"
  push:
    tags:
      - "v*.*.*a*"
  workflow_dispatch:
    inputs:
      reserve:
        description: "Publish the dummy PyPI package and mutable dev image only"
        required: false
        default: false
        type: boolean
      reserve_confirmation:
        description: "Type I_UNDERSTAND_RESERVED_ONLY to confirm this is not a release"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_NAME: ghcr.io/sauronshepherd/ronin
  LOCAL_IMAGE: ronin-prerelease:${{ github.sha }}

jobs:
  reserve-names:
    if: github.event_name == 'workflow_dispatch' && inputs.reserve == true && inputs.reserve_confirmation == 'I_UNDERSTAND_RESERVED_ONLY'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require explicit reservation confirmation
        env:
          CONFIRMATION: ${{ inputs.reserve_confirmation }}
        run: test "$CONFIRMATION" = "I_UNDERSTAND_RESERVED_ONLY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build pyronin
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build packages/pyronin
      - name: Publish pyronin dummy version
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/pyronin/dist
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish mutable development image
        run: |
          docker build --file docker/Dockerfile --tag "$IMAGE_NAME:dev" .
          docker push "$IMAGE_NAME:dev"

  v01-acceptance:
    name: strict v0.1 acceptance
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install release acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          python -m pip install --disable-pip-version-check -e '.[data-plane,open-tables,ml,security,streaming]'
      - name: Run and strictly qualify frozen v0.1 journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          python -m pytest tests/e2e -m e2e -v --junitxml=acceptance-evidence/v01-acceptance.xml
          python -m tools.v01_acceptance_gate \
            acceptance-evidence/v01-acceptance.xml \
            --evidence-json=/tmp/v01-acceptance-strict.json
      - name: Upload strict acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v01-acceptance-strict
          path: |
            /tmp/v01-acceptance-strict.json
            acceptance-evidence/v01-acceptance.xml
          if-no-files-found: error
          retention-days: 90

  build-pyronin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned release tooling
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r third_party/qualification-tools-v1.txt
      - name: Install test runner runtime
        run: python -m pip install --disable-pip-version-check pytest
      - name: Build pyronin once
        run: python -m build packages/pyronin
      - name: Install the built wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps packages/pyronin/dist/*.whl
      - name: Test the built wheel
        run: python -m pytest packages/pyronin/tests -q -o addopts=
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyronin-dist
          path: packages/pyronin/dist/*
          if-no-files-found: error
          retention-days: 1

  build-and-smoke-image:
    needs: build-pyronin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image once
        run: docker build --file docker/Dockerfile --tag "$LOCAL_IMAGE" .
      - name: Smoke test exact image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ronin-smoke \
            --env RONIN_TOKEN=ci-smoke-token \
            --env 'RONIN_TOKEN_SCOPES={"version":1,"grants":[{"version":1,"actions":["cancel","evidence:read","events","execute","list","read","submit"],"resource":{"kind":"project","identifier":null},"constraints":{}}]}' \
            "$LOCAL_IMAGE"
          trap 'docker rm -f ronin-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec ronin-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1).read()"; then
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' ronin-smoke)" != "true" ]; then
              docker logs ronin-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs ronin-smoke
          exit 1
      - name: Save exact release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save "$LOCAL_IMAGE" | gzip > ronin-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ronin-image
          path: ronin-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  validate-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - v01-acceptance
      - build-pyronin
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      image-version: ${{ steps.version.outputs.image-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require release commit to be reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to commits reachable from main." >&2
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyronin-dist
          path: dist
      - name: Enforce tag, source, and wheel version equality
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import glob
          import os
          import re
          import tomllib
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)a(\d+)", tag)
          if match is None:
              raise SystemExit(f"Invalid prerelease tag {tag!r}; expected vMAJOR.MINOR.PATCHaN")

          major, minor, patch, alpha = match.groups()
          package_version = f"{major}.{minor}.{patch}a{alpha}"
          image_version = f"{major}.{minor}.{patch}-alpha.{alpha}"

          with Path("packages/pyronin/pyproject.toml").open("rb") as handle:
              source_version = tomllib.load(handle)["project"]["version"]
          if source_version != package_version:
              raise SystemExit(
                  f"Tag {tag} resolves to {package_version}, but pyproject.toml declares {source_version}"
              )

          module = ast.parse(Path("packages/pyronin/src/pyronin/__init__.py").read_text())
          module_version = None
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          module_version = ast.literal_eval(node.value)
          if module_version != package_version:
              raise SystemExit(
                  f"pyronin.__version__ is {module_version!r}, expected {package_version!r}"
              )

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found: {wheels}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_paths = [name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit(f"Expected one wheel METADATA file, found: {metadata_paths}")
              metadata = Parser().parsestr(wheel.read(metadata_paths[0]).decode("utf-8"))
          wheel_version = metadata.get("Version")
          if wheel_version != package_version:
              raise SystemExit(
                  f"Built wheel version is {wheel_version!r}, expected {package_version!r}"
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"package-version={package_version}\n")
              handle.write(f"image-version={image_version}\n")
          PY

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-pyronin
      - build-and-smoke-image
      - validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyronin-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ronin-image
          path: .
      - name: Load exact smoke-tested image
        run: gunzip -c ronin-image.tar.gz | docker load
      - name: Generate Python distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: pyronin.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: ronin-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record exact Python artifact identity
        run: python -m tools.artifact_identity dist/*.whl dist/*.tar.gz --output pyronin-artifact-identity.json
      - name: Create candidate provenance subject descriptor
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          identity = json.loads(Path("pyronin-artifact-identity.json").read_text(encoding="utf-8"))
          subjects = [{"name": item["name"], "digest": {"sha256": item["sha256"]}} for item in identity["artifacts"]]
          image_path = Path("ronin-image.tar.gz")
          image_digest = __import__("hashlib").sha256(image_path.read_bytes()).hexdigest()
          subjects.append({"name": image_path.name, "digest": {"sha256": image_digest}})
          Path("candidate-provenance.json").write_text(json.dumps({
              "schema": "ronin.candidate-provenance/v1",
              "commit": os.environ["CANDIDATE_COMMIT"],
              "buildType": "github-actions/release-candidate",
              "subject": subjects,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Validate candidate-bound supply-chain evidence
        run: >-
          python -m tools.supply_chain_evidence
          --commit "${{ github.sha }}"
          --artifact-identity pyronin-artifact-identity.json
          --sbom pyronin.spdx.json
          --sbom ronin-image.spdx.json
          --provenance candidate-provenance.json
          --output supply-chain-evidence.json
      - name: Attest exact Python distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            pyronin.spdx.json
            ronin-image.spdx.json
            pyronin-artifact-identity.json
            candidate-provenance.json
            supply-chain-evidence.json
          if-no-files-found: error
          retention-days: 90

  authoritative-release-verdict:
    name: Require exact aggregate release verdict
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Resolve one successful aggregate run for this exact commit
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-evidence.yml/runs?head_sha=${GITHUB_SHA}&event=workflow_dispatch&status=completed&per_page=100")"
          run_ids="$(python -c 'import json,sys,os; data=json.load(sys.stdin); print("\n".join(str(run["id"]) for run in data["workflow_runs"] if run["head_sha"]==os.environ["GITHUB_SHA"] and run["event"]=="workflow_dispatch" and run["conclusion"]=="success"))' <<<"$response")"
          count="$(printf '%s\n' "$run_ids" | sed '/^$/d' | wc -l)"
          test "$count" -eq 1 || {
            echo "Expected exactly one successful aggregate release run for $GITHUB_SHA, found $count" >&2
            exit 1
          }
          echo "run-id=$(printf '%s\n' "$run_ids" | sed '/^$/d')" >> "$GITHUB_OUTPUT"
      - name: Download exact aggregate verdict
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.aggregate.outputs.run-id }}
          name: exact-release-verdict
          path: exact-release-verdict
      - name: Verify exact green release verdict
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          verdict = json.loads(Path("exact-release-verdict/release-verdict.json").read_text(encoding="utf-8"))
          required = {
              "ci", "security", "status-consistency", "docker-qualification", "mutation",
              "browser", "a11y", "installed-artifact", "sbom-provenance", "license",
              "artifact-identity",
          }
          if verdict.get("schema") != "ronin.release-verdict/v1":
              raise SystemExit("aggregate verdict schema is not release-verdict/v1")
          if verdict.get("commit") != os.environ["EXPECTED_COMMIT"]:
              raise SystemExit("aggregate verdict commit does not match tag commit")
          if verdict.get("status") != "passed":
              raise SystemExit("aggregate release verdict is not passed")
          if set(verdict.get("required_gates", [])) != required:
              raise SystemExit("aggregate verdict does not contain the complete release gate profile")
          if not isinstance(verdict.get("verdict_sha256"), str) or len(verdict["verdict_sha256"]) != 64:
              raise SystemExit("aggregate verdict is missing its digest")
          PY

  publish-pypi:
    needs:
      - build-pyronin
      - validate-release
      - release-evidence
      - authoritative-release-verdict
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pyronin-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-ghcr:
    needs:
      - build-and-smoke-image
      - validate-release
      - release-evidence
      - authoritative-release-verdict
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ronin-image
          path: .
      - name: Load exact smoke-tested image
        run: gunzip -c ronin-image.tar.gz | docker load
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push commit staging reference and capture OCI digest
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          staging_tag="$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$staging_tag"
          docker push "$staging_tag"
          manifest_json="$(docker buildx imagetools inspect "$staging_tag" --format '{{json .Manifest}}')"
          digest="$(python -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$manifest_json")"
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid registry digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "staging-tag=$staging_tag" >> "$GITHUB_OUTPUT"
      - name: Attest published OCI subject
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.registry.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable semantic tag and mutable alpha alias
        shell: bash
        env:
          REGISTRY_DIGEST: ${{ steps.registry.outputs.digest }}
        run: |
          set -euo pipefail
          version_tag="$IMAGE_NAME:${{ needs.validate-release.outputs.image-version }}"
          alpha_tag="$IMAGE_NAME:alpha"
          dev_tag="$IMAGE_NAME:dev"

          if existing_json="$(docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}' 2>/dev/null)"; then
            existing_digest="$(python -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$existing_json")"
            if [ "$existing_digest" != "$REGISTRY_DIGEST" ]; then
              echo "Refusing to repoint immutable semantic tag $version_tag from $existing_digest to $REGISTRY_DIGEST" >&2
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$version_tag" "$IMAGE_NAME@$REGISTRY_DIGEST"
          fi

          version_json="$(docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}')"
          version_digest="$(python -c 'import json,sys; print(json.load(sys.stdin)["digest"])' <<<"$version_json")"
          test "$version_digest" = "$REGISTRY_DIGEST"

          docker buildx imagetools create --tag "$alpha_tag" "$IMAGE_NAME@$REGISTRY_DIGEST"
          docker buildx imagetools create --tag "$dev_tag" "$IMAGE_NAME@$REGISTRY_DIGEST"

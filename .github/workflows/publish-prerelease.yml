name: Publish prerelease artifacts

on:
  push:
    branches:
      - chore/pypi-trusted-publishing
    tags:
      - "v*-alpha*"
      - "v*-a*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pyronin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build pytest
      - run: python -m pytest packages/pyronin/tests -q
      - run: python -m build packages/pyronin
      - uses: actions/upload-artifact@v4
        with:
          name: pyronin-dist
          path: packages/pyronin/dist/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-pyronin
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyronin-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/sauronshepherd/ronin:0.1.0-alpha.1
            ghcr.io/sauronshepherd/ronin:alpha

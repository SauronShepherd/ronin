name: Reserve package and image names

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/sauronshepherd/ronin
  IMAGE_TAG: dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pyronin distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build packages/pyronin

      - name: Publish pyronin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pyronin/dist

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish mutable development image
        run: |
          docker build --file docker/Dockerfile --tag "$IMAGE_NAME:$IMAGE_TAG" .
          docker push "$IMAGE_NAME:$IMAGE_TAG"

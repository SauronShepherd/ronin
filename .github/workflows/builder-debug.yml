name: Builder diagnostics

on:
  push:
    branches: [mvp/local-worker-runtime]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.capture.outputs.summary }}
      status: ${{ steps.capture.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Capture diagnostic summary
        id: capture
        shell: bash
        run: |
          set +e
          make test > /tmp/test.log 2>&1
          test_exit=$?
          ruff format --check python tests tools packages docker > /tmp/format.log 2>&1
          format_exit=$?
          ruff check python tests tools packages docker > /tmp/lint.log 2>&1
          lint_exit=$?
          mypy python tools packages/pyronin/src docker > /tmp/mypy.log 2>&1
          mypy_exit=$?
          summary=$(grep -E "ImportError|ModuleNotFoundError|TypeError|ValueError|AttributeError|NameError|SyntaxError" /tmp/test.log | tail -n 3 | tr '\n' ';' | cut -c1-240)
          status="test=${test_exit},format=${format_exit},lint=${lint_exit},mypy=${mypy_exit}"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

  expose:
    needs: diagnose
    name: "${{ needs.diagnose.outputs.status }} -- ${{ needs.diagnose.outputs.summary }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo diagnostic summary exposed in job name

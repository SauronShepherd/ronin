name: Builder diagnostics

on:
  push:
    branches: [mvp/local-worker-runtime]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Capture test and quality diagnostics
        shell: bash
        run: |
          set +e
          make test > /tmp/test.log 2>&1
          echo "make_test_exit=$?" > /tmp/status.txt
          ruff format --check python tests tools packages docker > /tmp/format.log 2>&1
          echo "format_exit=$?" >> /tmp/status.txt
          ruff check python tests tools packages docker > /tmp/lint.log 2>&1
          echo "lint_exit=$?" >> /tmp/status.txt
          mypy python tools packages/pyronin/src docker > /tmp/mypy.log 2>&1
          echo "mypy_exit=$?" >> /tmp/status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: builder-diagnostics
          path: |
            /tmp/status.txt
            /tmp/test.log
            /tmp/format.log
            /tmp/lint.log
            /tmp/mypy.log
          if-no-files-found: error
          retention-days: 1

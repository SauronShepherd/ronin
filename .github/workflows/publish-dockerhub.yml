name: Publish Ronin to Docker Hub

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Mutable development alias to publish"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - edge

permissions:
  contents: read

jobs:
  publish:
    name: Publish mutable Docker Hub alias only
    runs-on: ubuntu-latest
    environment: dockerhub-development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate mutable alias allowlist
        shell: bash
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          case "$ALIAS" in
            dev|edge) ;;
            *) echo "Refusing non-development Docker alias: $ALIAS" >&2; exit 1 ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Ronin image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ronin:${{ inputs.alias }}

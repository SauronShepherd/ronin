name: Phase 7 lock commit

on:
  push:
    branches: [chore/v01-scope-freeze]
    paths: [".github/workflows/phase7-lock-commit.yml"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/v01-scope-freeze
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Generate, verify and commit lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          uv pip compile pyproject.toml --extra dev --generate-hashes -o requirements-dev.lock
          test -s requirements-dev.lock
          grep -q -- '--hash=sha256:' requirements-dev.lock
          git rm .github/workflows/phase7-lock-commit.yml
          git config user.name "Ronin Autonomous Builder"
          git config user.email "actions@users.noreply.github.com"
          git add requirements-dev.lock
          git commit -m "build(quality): add hash-locked development dependencies"
          git push origin HEAD:chore/v01-scope-freeze

name: Notebook lint helper

on:
  push:
    branches: [feat/notebook-dependency-contracts]

permissions:
  contents: read

jobs:
  lint-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Capture lint evidence
        shell: bash
        run: |
          set +e
          ruff check python/studio_notebook tests/test_notebook_dependencies.py > lint.txt 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> lint.txt
          exit 0
      - name: Upload lint evidence
        uses: actions/upload-artifact@v4
        with:
          name: notebook-lint-evidence
          path: lint.txt
          if-no-files-found: error
          retention-days: 1

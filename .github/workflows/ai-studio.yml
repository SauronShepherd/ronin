name: Retired AI surfaces and external skills boundary

on:
  pull_request:
    paths:
      - "agent-skills/**"
      - "python/studio_ai_studio/**"
      - "python/studio_genai/**"
      - "python/studio_cli/agent_skills.py"
      - "tests/test_agent_skills.py"
      - "tests/test_ai_studio_*.py"
      - "tests/test_genai_*.py"
      - "tests/test_public_capability_matrix.py"
      - "tests/test_web_package_assets.py"
      - "pyproject.toml"
      - "web/routes.json"
      - "docs/product/PUBLIC_V1_SCOPE.md"
      - ".github/workflows/ai-studio.yml"
  push:
    branches: [main]
    paths:
      - "agent-skills/**"
      - "python/studio_ai_studio/**"
      - "python/studio_genai/**"
      - "python/studio_cli/agent_skills.py"
      - "tests/test_agent_skills.py"
      - "tests/test_ai_studio_*.py"
      - "tests/test_genai_*.py"
      - "tests/test_public_capability_matrix.py"
      - "tests/test_web_package_assets.py"
      - "pyproject.toml"
      - "web/routes.json"
      - "docs/product/PUBLIC_V1_SCOPE.md"
      - ".github/workflows/ai-studio.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,data-plane]"
      - name: Validate the retired runtime boundary and external coding-agent skills
        run: >-
          python -m pytest -q
          tests/test_agent_skills.py
          tests/test_public_capability_matrix.py
          tests/test_web_package_assets.py
      - name: Check Python style for the guarded surfaces
        run: >-
          python -m ruff check
          python/studio_cli/agent_skills.py
          tests/test_agent_skills.py
          tests/test_public_capability_matrix.py
          tests/test_web_package_assets.py

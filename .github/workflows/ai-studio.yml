name: AI Studio

on:
  pull_request:
    paths:
      - "python/studio_ai_studio/**"
      - "tests/test_ai_studio_*.py"
      - "tools/ai_studio_*.py"
      - "docs/architecture/AI_STUDIO_*.md"
      - "docs/operations/AI_STUDIO_*.md"
      - ".github/workflows/ai-studio.yml"
  push:
    branches: [main]
    paths:
      - "python/studio_ai_studio/**"
      - "tests/test_ai_studio_*.py"
      - "tools/ai_studio_*.py"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime matrix target"
        required: true
        default: "simulated"
        type: choice
        options: [simulated, ollama, llama-cpp, vllm]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check python/studio_ai_studio tools/ai_studio_*.py tests/test_ai_studio_*.py
      - run: python -m mypy python/studio_ai_studio
      - run: python -m pytest -q tests/test_ai_studio_*.py
      - run: python tools/ai_studio_benchmark.py --iterations 1000 --output ai-studio-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-studio-benchmark
          path: ai-studio-benchmark.json

  real-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime != 'simulated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document runtime gate
        run: |
          echo "Runtime target: ${{ inputs.runtime }}"
          echo "Provision the selected runtime/model in the runner before invoking ai_studio_runtime_smoke.py."
          echo "This job is intentionally manual and never reports simulated traffic as real-runtime validation."

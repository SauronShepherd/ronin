name: Phase 1 baseline capture

on:
  push:
    branches:
      - chore/v01-scope-freeze

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Rebuild fresh baseline environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-baseline
          source .venv-baseline/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip freeze > /tmp/baseline-freeze.txt
          echo "BASELINE_SHA|$(git rev-parse HEAD)"
          echo "BASELINE_PYTHON|$(python --version 2>&1)"
          echo "BASELINE_PLATFORM|$(uname -a)"
          echo "BASELINE_FREEZE_COUNT|$(wc -l < /tmp/baseline-freeze.txt)"
      - name: Time full quality gate stages
        shell: bash
        run: |
          set -euo pipefail
          source .venv-baseline/bin/activate
          for target in format lint typecheck architecture gates-negative test; do
            start=$(python -c 'import time; print(time.perf_counter())')
            set +e
            make "$target" > "/tmp/phase1-${target}.log" 2>&1
            status=$?
            set -e
            end=$(python -c 'import time; print(time.perf_counter())')
            elapsed=$(python - "$start" "$end" <<'PY'
          import sys
          print(f"{float(sys.argv[2]) - float(sys.argv[1]):.3f}")
          PY
          )
            echo "BASELINE_GATE|${target}|${elapsed}"
            if [ "$status" -ne 0 ]; then
              cat "/tmp/phase1-${target}.log"
              exit "$status"
            fi
          done
          make check > /tmp/phase1-check.log 2>&1
          echo "BASELINE_CHECK|green"
      - name: Capture coverage and performance
        shell: bash
        run: |
          set -euo pipefail
          source .venv-baseline/bin/activate
          coverage json -o /tmp/coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/coverage.json').read_text(encoding='utf-8'))
          for package in ('studio_core', 'studio_notebook', 'studio_kernel', 'studio_runners'):
              statements = covered = branches = covered_branches = 0
              for filename, payload in data['files'].items():
                  normalized = filename.replace('\\', '/')
                  if f'/{package}/' not in f'/{normalized}' and not normalized.startswith(f'{package}/'):
                      continue
                  summary = payload['summary']
                  statements += summary['num_statements']
                  covered += summary['covered_lines']
                  branches += summary['num_branches']
                  covered_branches += summary['covered_branches']
              line_pct = 100.0 if statements == 0 else covered * 100.0 / statements
              branch_pct = 100.0 if branches == 0 else covered_branches * 100.0 / branches
              print(f'BASELINE_COVERAGE|{package}|{line_pct:.2f}|{branch_pct:.2f}')
          PY
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from time import perf_counter

          from studio_core import Edge, Node, OperatorRef, Pipeline, Port, builtin_operator_catalog, validate_operator_node
          from studio_kernel import ExecutionAttemptId, ExecutionEvent, ExecutionEventId, JsonlExecutionEventSink

          sources = tuple(
              Node.create(
                  operator=OperatorRef('benchmark.source'),
                  instance_key=f'source-{index}',
                  outputs=(Port('out'),),
              )
              for index in range(799)
          )
          sink_node = Node.create(
              operator=OperatorRef('benchmark.sink'),
              instance_key='sink',
              inputs=tuple(Port(f'in-{index}') for index in range(799)),
          )
          edges = tuple(
              Edge(source.id, 'out', sink_node.id, f'in-{index}')
              for index, source in enumerate(sources)
          )
          start = perf_counter()
          Pipeline(sources + (sink_node,), edges)
          fanin_ms = (perf_counter() - start) * 1000

          param_node = Node.create(
              operator=OperatorRef('benchmark.params'),
              instance_key='params',
              params={f'p{index:02d}': index for index in range(50)},
          )
          start = perf_counter()
          for _ in range(100_000):
              param_node.param('p49')
          param_ms = (perf_counter() - start) * 1000

          catalog = builtin_operator_catalog()
          operator_node = Node.create(
              operator=OperatorRef('transform.join'),
              instance_key='operator-validation',
          )
          start = perf_counter()
          for _ in range(20_000):
              validate_operator_node(operator_node, catalog)
          operator_ms = (perf_counter() - start) * 1000

          temp_root = Path('/dev/shm') if Path('/dev/shm').is_dir() else None
          with TemporaryDirectory(dir=temp_root) as directory:
              path = Path(directory) / 'events.jsonl'
              event_sink = JsonlExecutionEventSink(path)
              attempt = ExecutionAttemptId('baseline-attempt')
              start = perf_counter()
              for sequence in range(200):
                  event_sink.append(
                      ExecutionEvent(
                          ExecutionEventId(attempt, sequence),
                          'session.started',
                      )
                  )
              sink_ms_per_event = (perf_counter() - start) * 1000 / 200

          print(f'BASELINE_PERF|pipeline_fanin_800_ms|{fanin_ms:.3f}')
          print(f'BASELINE_PERF|node_param_100k_ms|{param_ms:.3f}')
          print(f'BASELINE_PERF|validate_operator_node_20k_ms|{operator_ms:.3f}')
          print(f'BASELINE_PERF|jsonl_sink_append_ms_per_event|{sink_ms_per_event:.6f}')
          print(f'BASELINE_PERF_TMP|{temp_root or Path("/tmp")}')
          PY
      - name: Upload dependency freeze seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-baseline-freeze-${{ github.sha }}
          path: /tmp/baseline-freeze.txt
          retention-days: 14

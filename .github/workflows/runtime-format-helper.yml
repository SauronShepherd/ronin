name: Runtime documentation helper

on:
  push:
    branches: [feat/runtime-discovery-evidence]

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append durable runtime discovery records
        env:
          ADR: 
          PROGRESS: 
          PRODUCT: 
        run: |
          grep -q 'ADR-AUTO-014' docs/automation/DECISIONS.md || printf '%s' "$ADR" | base64 -d >> docs/automation/DECISIONS.md
          grep -q 'E1 runtime discovery and resolved-runtime evidence' docs/automation/PROGRESS.md || printf '%s' "$PROGRESS" | base64 -d >> docs/automation/PROGRESS.md
          grep -q 'Runtime discovery boundary and pre-execution snapshot' docs/product/PROJECTS_AND_EXECUTION.md || printf '%s' "$PRODUCT" | base64 -d >> docs/product/PROJECTS_AND_EXECUTION.md
      - name: Commit documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: record runtime discovery contracts"
          git push origin HEAD:feat/runtime-discovery-evidence

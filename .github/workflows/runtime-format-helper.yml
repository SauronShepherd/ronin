name: Runtime format helper

on:
  push:
    branches: [feat/runtime-discovery-evidence]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical formatting
        run: ruff format python tests tools
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python tests tools
          git commit -m "style: apply canonical runtime formatting"
          git push origin HEAD:feat/runtime-discovery-evidence

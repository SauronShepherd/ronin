name: Phase 8 fixture capture

on:
  push:
    branches: [chore/v01-scope-freeze]
    paths:
      - "examples/demo/build_fixture.py"
      - ".github/workflows/phase8-fixture-capture.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Generate and print fixture
        run: |
          python examples/demo/build_fixture.py
          echo '---FIXTURE-BEGIN---'
          cat examples/demo/notebooks/etl.ronin.json
          echo '---FIXTURE-END---'
